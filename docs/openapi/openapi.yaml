                $ref: '#/components/schemas/StravaConnectionResponse'
        '400':
          description: Strava integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '404':
          description: No Strava connection exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /strava/webhook:
    get:
      tags:
      - strava
      operationId: handle_webhook_verification
      responses:
        '200':
          description: Verifies the Strava webhook subscription handshake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StravaWebhookChallengeResponse'
        '400':
          description: Invalid handshake query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
      - strava
      operationId: handle_webhook_event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StravaWebhookEvent'
        required: true
      responses:
        '200':
          description: Accepted a Strava webhook event
