openapi: 3.1.0
info:
  title: api
  description: ''
  license:
    name: ''
  version: 0.1.0
servers:
- url: /api
paths:
  /activities:
    get:
      tags:
      - activities
      operationId: list_activities
      parameters:
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Recent activities for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_ActivityResponse'
        '401':
          description: Not authenticated
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activities/{id}:
    get:
      tags:
      - activities
      operationId: get_activity
      parameters:
      - name: id
        in: path
        description: Activity ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Activity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '401':
          description: Not authenticated
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
    delete:
      tags:
      - activities
      operationId: delete_activity
      parameters:
      - name: id
        in: path
        description: Activity ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Activity deleted
        '401':
          description: Not authenticated
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
    patch:
      tags:
      - activities
      operationId: update_activity
      parameters:
      - name: id
        in: path
        description: Activity ID
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
        required: true
      responses:
        '200':
          description: Updated activity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          description: Invalid activity update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activities/{id}/regenerate:
    post:
      tags:
      - activities
      operationId: regenerate_activity
      parameters:
      - name: id
        in: path
        description: Activity ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Regenerated activity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          description: Activity cannot be regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activities/{id}/source-file:
    get:
      tags:
      - activities
      operationId: download_activity_source_file
      parameters:
      - name: id
        in: path
        description: Activity ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Original retained source file for the activity
        '401':
          description: Not authenticated
        '404':
          description: Activity source file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports:
    get:
      tags:
      - activity-imports
      operationId: list_activity_imports
      responses:
        '200':
          description: Recent activity imports for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityImportResponse'
        '401':
          description: Not authenticated
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - activity-imports
      operationId: upload_activity_import
      requestBody:
        content:
          multipart/form-data: {}
      responses:
        '200':
          description: Activity was already imported and the existing record was returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityImportResponse'
        '202':
          description: Activity import queued for worker processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityImportResponse'
        '400':
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports/archive-jobs:
    get:
      tags:
      - activity-imports
      operationId: list_activity_archive_import_jobs
      responses:
        '200':
          description: Recent archive import jobs for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityArchiveImportJobResponse'
        '401':
          description: Not authenticated
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports/archive-jobs/{id}:
    get:
      tags:
      - activity-imports
      operationId: get_activity_archive_import_job
      parameters:
      - name: id
        in: path
        description: Archive import job id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Archive import job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityArchiveImportJobResponse'
        '401':
          description: Not authenticated
        '404':
          description: Archive import job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports/archive-url:
    post:
      tags:
      - activity-imports
      operationId: import_activity_archive_from_url
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveUrlImportRequest'
        required: true
      responses:
        '202':
          description: Archive import job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityArchiveImportJobResponse'
        '400':
          description: Invalid archive URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports/processing-graph:
    get:
      tags:
      - activity-imports
      operationId: get_activity_processing_graph
      responses:
        '200':
          description: Activity import processing DAG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityProcessingGraphResponse'
        '401':
          description: Not authenticated
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports/processing-state:
    get:
      tags:
      - activity-imports
      operationId: get_activity_processing_state
      responses:
        '200':
          description: Current activity processing state for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityProcessingStateResponse'
        '401':
          description: Not authenticated
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /activity-imports/{id}/trace:
    get:
      tags:
      - activity-imports
      operationId: get_activity_import_trace
      parameters:
      - name: id
        in: path
        description: Activity import id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Activity import processing DAG and event trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityImportTraceResponse'
        '401':
          description: Not authenticated
        '404':
          description: Activity import not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activities:
    get:
      tags:
      - admin
      operationId: admin_list_activities
      parameters:
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Paginated activities for administrators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AdminActivityResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activities/{id}/import-trace:
    get:
      tags:
      - admin
      operationId: admin_get_activity_import_trace_for_activity
      parameters:
      - name: id
        in: path
        description: Activity id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Activity import processing DAG and event trace for administrators when the activity has a linked import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActivityImportTraceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activity-imports/archive:
    post:
      tags:
      - admin
      operationId: admin_import_activity_archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveImportRequest'
        required: true
      responses:
        '200':
          description: Imported activities from an archive on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveImportResponse'
        '400':
          description: Invalid archive request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Archive not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activity-imports/cleanup-duplicates:
    post:
      tags:
      - admin
      operationId: admin_cleanup_user_duplicate_activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupUserDuplicateActivitiesRequest'
        required: true
      responses:
        '200':
          description: Removed duplicate activities for one user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupUserDuplicateActivitiesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activity-imports/reprocess:
    post:
      tags:
      - admin
      operationId: admin_reprocess_user_activity_imports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessUserActivityImportsRequest'
        required: true
      responses:
        '202':
          description: Queued stored-file activity reprocessing for one user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessUserActivityImportsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activity-imports/reprocess-activity:
    post:
      tags:
      - admin
      operationId: admin_reprocess_activity_import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessActivityImportRequest'
        required: true
      responses:
        '202':
          description: Queued stored-file activity reprocessing for one activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessActivityImportResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/activity-imports/{id}/trace:
    get:
      tags:
      - admin
      operationId: admin_get_activity_import_trace
      parameters:
      - name: id
        in: path
        description: Activity import id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Activity import processing DAG and event trace for administrators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityImportTraceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Activity import not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/analytics/backfill:
    post:
      tags:
      - admin
      operationId: admin_backfill_analytics
      responses:
        '202':
          description: Enqueued analytics backfill tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsBackfillResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/feature-flags:
    get:
      tags:
      - admin
      summary: List all feature flags
      operationId: list_flags
      responses:
        '200':
          description: List of feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_FeatureFlagResponse'
      security:
      - bearer_auth: []
  /admin/feature-flags/{key}:
    post:
      tags:
      - admin
      summary: Update a single feature flag
      operationId: update_flag
      parameters:
      - name: key
        in: path
        description: Feature flag key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlagRequest'
        required: true
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
      security:
      - bearer_auth: []
  /admin/integration-events:
    get:
      tags:
      - admin
      operationId: list_admin_integration_events
      parameters:
      - name: provider
        in: query
        description: Optional integration provider filter
        required: false
        schema:
          type: string
      - name: user_id
        in: query
        description: Optional Bike user id filter
        required: false
        schema:
          type: integer
          format: int32
      - name: activity_id
        in: query
        description: Optional activity id filter against event payload
        required: false
        schema:
          type: integer
          format: int32
      - name: import_id
        in: query
        description: Optional activity import id filter against event payload
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of rows to return
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Recent integration events for administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationEventResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/metrics:
    get:
      tags:
      - admin
      summary: Get glass-managed system metrics (auth, background tasks, etc.)
      description: Glass automatically expands this response as new subsystems are added.
      operationId: admin_get_metrics
      responses:
        '200':
          description: Glass system metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearer_auth: []
  /admin/metrics/app:
    get:
      tags:
      - admin
      operationId: admin_app_metrics
      responses:
        '200':
          description: Bike app metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedStat'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearer_auth: []
  /admin/segments/regenerate:
    post:
      tags:
      - admin
      operationId: admin_regenerate_user_segments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateUserSegmentsRequest'
        required: true
      responses:
        '202':
          description: Queued segment regeneration for one user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateUserSegmentsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Another activity import is already running or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/segments/regenerate-efforts:
    post:
      tags:
      - admin
      operationId: admin_regenerate_segment_efforts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateSegmentEffortsRequest'
        required: true
      responses:
        '202':
          description: Queued effort regeneration for one segment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateSegmentEffortsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Segment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - bearer_auth: []
  /admin/tasks:
    get:
      tags:
      - admin
      operationId: admin_list_tasks
      parameters:
      - name: task_type
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - name: from_date
        in: query
        required: false
        schema:
          type: string
      - name: to_date
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Admin list of background tasks
          content:
            application/json:
              schema:
