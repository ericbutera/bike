# Local Temporal shares PostgreSQL with Bike, using its own databases.
services:
  temporal-worker:
    env_file: ./docker/dev-cache.env
    restart: unless-stopped
    image: bike-dev-worker
    build:
      context: ./bike-rs
      dockerfile: Dockerfile.dev
      target: worker
      args:
        RUST_IMAGE: ${RUST_IMAGE:?Run Compose through mise}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:?Run Compose through mise}
        MISE_IMAGE: ${MISE_IMAGE:?Run Compose through mise}
        PROTOC_VERSION: ${PROTOC_VERSION:?Run Compose through mise}
    command: [cargo, run, --locked, --bin, temporal-worker]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
      UPLOADS_DIR: /app/uploads
      JWT_SECRET: ${BIKE_JWT_SECRET:-change_me_in_dev}
      STRAVA_TOKEN_ENCRYPTION_KEY: ${STRAVA_TOKEN_ENCRYPTION_KEY:-}
      RUST_LOG: info,sqlx=warn
      RUSTFLAGS: -D warnings
      TEMPORAL_ADDRESS: ${BIKE_TEMPORAL_ADDRESS:-http://temporal:7233}
      TEMPORAL_NAMESPACE: bike
      TEMPORAL_TASK_QUEUE: bike-strava
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${BIKE_TEMPORAL_WORKER_METRICS_PORT:-9092}:9092"
      - "127.0.0.1:${BIKE_TEMPORAL_PROVIDER_METRICS_PORT:-9093}:9091"
    volumes:
      - ./bike-rs:/app:ro
      - ${BIKE_UPLOADS_DIR:-uploads}:/app/uploads
      - build_storage:/cache
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/worker}
    stop_grace_period: 1m
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  temporal-databases:
    image: ${BIKE_POSTGRES_IMAGE:?Run Compose through mise}
    entrypoint: [psql]
    command:
      [
        --host=postgres,
        --username=postgres,
        --dbname=postgres,
        --set=ON_ERROR_STOP=1,
        --file=/setup/databases.sql,
      ]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./docker/temporal/databases.sql:/setup/databases.sql:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/databases}
    depends_on:
      postgres:
        condition: service_healthy

  temporal-schema:
    image: ${BIKE_TEMPORAL_TOOLS_IMAGE:?Run Compose through mise}
    entrypoint: [sh, /setup/schema.sh]
    environment:
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_PLUGIN: postgres12
    volumes:
      - ./scripts/temporal-schema.sh:/setup/schema.sh:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/schema}
    depends_on:
      temporal-databases:
        condition: service_completed_successfully

  temporal:
    image: ${BIKE_TEMPORAL_SERVER_IMAGE:?Run Compose through mise}
    command:
      [
        temporal-server,
        --config-file,
        /etc/temporal/config/server.yaml,
        --allow-no-auth,
        start,
      ]
    volumes:
      - ./docker/temporal/server.yaml:/etc/temporal/config/server.yaml:ro
      - ./docker/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/temporal}
    ports:
      - "127.0.0.1:${BIKE_TEMPORAL_PORT:-7233}:7233"
    stop_grace_period: 1m
    healthcheck:
      test:
        [
          CMD,
          wget,
          --quiet,
          --output-document=/dev/null,
          http://127.0.0.1:7243/api/v1/system-info,
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      temporal-schema:
        condition: service_completed_successfully

  temporal-namespace:
    image: ${BIKE_TEMPORAL_TOOLS_IMAGE:?Run Compose through mise}
    entrypoint: [sh, /setup/namespace.sh]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: bike
    volumes:
      - ./scripts/temporal-namespace.sh:/setup/namespace.sh:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/namespace}
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    image: ${BIKE_TEMPORAL_UI_IMAGE:?Run Compose through mise}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: bike
      TEMPORAL_UI_PORT: 8080
    volumes:
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/temporal-ui}
    ports:
      - "127.0.0.1:${BIKE_TEMPORAL_UI_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully

volumes:
  uploads:
    name: ${BIKE_UPLOADS_VOLUME:-bike_uploads}
  build_storage:
    external: true
    name: bike-build-storage
