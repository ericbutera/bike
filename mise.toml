[tools]
node = "25.2.1"
ruby = "3.4.11"
go = "1.25.1"
prek = "0.4.12"
protoc = "36.2"
"npm:prettier" = "3.7.4"

[tasks."compose:config"]
description = "Validate the shared Bike services Compose stack"
run = "COMPOSE_PROJECT_NAME=bike docker compose config"

[tasks."compose:up"]
description = "Start Bike Rust, the shared UI, PostgreSQL, and map renderer"
run = "COMPOSE_PROJECT_NAME=bike docker compose up -d --build"

[tasks."compose:down"]
description = "Stop the shared Bike services Compose stack"
run = "COMPOSE_PROJECT_NAME=bike docker compose down"

[tasks."rust:check"]
description = "Run Rust backend formatting, lint, and tests"
run = ["mise --cd bike-rs run fmt:check", "mise --cd bike-rs run lint", "mise --cd bike-rs run test"]

[tasks."ui:check"]
description = "Run shared UI type, test, build, and format checks"
run = ["mise --cd bike-ui run lint", "mise --cd bike-ui run typecheck", "mise --cd bike-ui run test", "mise --cd bike-ui run build", "mise --cd bike-ui run format:check", "mise --cd bike-ui run openapi:check"]

[tasks.lint]
description = "Run Rust, UI, and gateway linters and renderer formatting"
run = ["mise --cd bike-rs run fmt:check", "mise --cd bike-rs run lint", "mise --cd bike-ui run lint"]

[tasks."hooks:install"]
description = "Install the repository-root prek pre-commit hook"
run = "prek install -f"

[tasks."hooks:check"]
description = "Run every pre-commit check against tracked files"
run = "prek run --all-files"

[tasks."format:staged"]
description = "Run prek checks for staged files"
run = "prek run"

[tasks.check]
description = "Run Rust, shared UI, service, and contract checks"
run = ["mise run rust:check", "mise run ui:check", "mise run contracts:check"]

[tasks."assets:sync"]
description = "Synchronize intentional build-context mirrors from their canonical owners"
run = "node scripts/sync-shared-assets.mjs"

[tasks."contracts:check"]
description = "Check Rust HTTP contracts, asset copies, UI inventory, and routes"
run = ["ruby scripts/check-contracts.rb", "ruby scripts/audit-api-routes.rb"]

[tasks."audit:api:write"]
description = "Refresh the reviewed Rust source-route inventory"
run = "ruby scripts/audit-api-routes.rb --write"

[tasks."test:integration"]
description = "Run native Rust API integration tests"
run = "mise --cd bike-rs run test:integration"

[tasks."test:production"]
description = "Run the read-only production activity, segment, and race journey"
run = '''
: "${BIKE_TEST_AUTH_FILE:?Provide a private short-lived test token file}"
: "${BIKE_UI_URL:?Provide the deployed Bike UI origin}"
: "${BIKE_API_URL:?Provide the deployed Bike API origin}"
: "${BIKE_TEST_ACTIVITY_ID:?Select an existing activity with GPS}"
: "${BIKE_TEST_SEGMENT_ID:?Select an existing segment}"
: "${BIKE_TEST_RACE_EFFORT_IDS:?Select existing race effort IDs}"
mise --cd bike-ui run test:e2e
'''
