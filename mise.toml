[tools]
node = "25.2.1"
pnpm = "10.30.1"
prek = "0.4.12"
rust = "1.97.1"
"npm:prettier" = "3.7.4"

[tasks."hooks:install"]
description = "Install prek Git hooks for this repository"
run = "prek install -f"

[tasks."format:staged"]
description = "Run prek on staged files"
run = "prek run"

[tasks."ui-next:deps"]
description = "Install ui-next dependencies"
dir = "ui-next"
run = "pnpm install"

[tasks."ui-next:dev"]
description = "Start the bike Next frontend"
depends = ["ui-next:deps"]
dir = "ui-next"
run = "pnpm run dev"

[tasks."ui-next:typecheck"]
description = "Typecheck the bike Next frontend"
dir = "ui-next"
run = "pnpm typecheck"

[tasks."api:dev"]
description = "Start the bike API"
run = "cargo run --bin api"

[tasks."api:build"]
description = "Build the bike API"
run = "cargo build --release --bin api"

[tasks."worker:dev"]
description = "Start the bike worker"
run = "cargo run --bin worker"

[tasks."tracing:dev"]
description = "Start lightweight local tracing with Jaeger"
run = "docker compose --profile tracing up jaeger"

[tasks."compose:up"]
description = "Start the Rust Bike Compose stack"
run = "docker compose up"

[tasks."kaleido:status"]
description = "Show the Rust and UI Kaleido versions used by Bike"
run = '''
echo "Rust Kaleido:"
cargo tree -i kaleido --depth 0
echo
echo "UI Kaleido:"
pnpm --dir ui-next exec node -p "require('./package.json').dependencies['@ericbutera/kaleido']"
'''

[tasks."kaleido:update"]
description = "Update Rust and UI Kaleido packages; run as VERSION=x.y.z mise run kaleido:update"
run = '''
VERSION="${VERSION:?Set VERSION=x.y.z}"
export VERSION
perl -0pi -e 's/^kaleido = "[^"]+"/kaleido = "$ENV{VERSION}"/m' Cargo.toml
cargo update -p kaleido --precise "$VERSION"
pnpm --dir ui-next up "@ericbutera/kaleido@$VERSION"
pnpm --dir ui-next typecheck
'''

[tasks."migration:up"]
description = "Run bike database migrations"
dir = "migration"
run = "cargo run -- up"

[tasks.test]
description = "Run bike Rust tests"
run = "cargo test"

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting without writing changes"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run Rust Clippy checks"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."openapi:react-query"]
description = "Generate the TypeScript API definitions from the checked-in OpenAPI spec"
depends = ["generate:openapi"]
run = "mise run generate:typescript"

[tasks."generate:openapi"]
description = "Generate the checked-in OpenAPI JSON and YAML documents from Utopia"
run = "cargo run -p api --bin openapi"

[tasks."generate:typescript"]
description = "Generate the frontend TypeScript API contract from OpenAPI"
run = "NPM_CONFIG_CACHE=\"${NPM_CONFIG_CACHE:-.cache/npm}\" npx --yes openapi-typescript@7.13.0 docs/openapi/openapi.yaml --output ui-next/lib/openapi/react-query/api.d.ts"

[tasks."openapi:typescript:check"]
description = "Check the generated frontend TypeScript API contract is fresh"
run = '''
GENERATED_TYPES="$(mktemp)"
trap 'rm -f "$GENERATED_TYPES"' EXIT
NPM_CONFIG_CACHE="${NPM_CONFIG_CACHE:-.cache/npm}" npx --yes openapi-typescript@7.13.0 docs/openapi/openapi.yaml --output "$GENERATED_TYPES"
cmp -- "$GENERATED_TYPES" ui-next/lib/openapi/react-query/api.d.ts
'''
