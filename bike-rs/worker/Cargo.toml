[package]
name = "worker"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "temporal-worker"
path = "src/temporal_main.rs"

[lib]
name = "worker"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
strava-temporal = { path = "../strava-temporal" }
temporalio-sdk = { workspace = true }
temporalio-common = { workspace = true }
temporalio-client = { workspace = true }
bike-core = { path = "../bike-core" }
integrations = { path = "../integrations" }
bike-temporal = { path = "../bike-temporal" }
tokio = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }

[dev-dependencies]
bike-core = { path = "../bike-core", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["test-util"] }
