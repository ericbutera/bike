[package]
name = "worker"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "worker"
path = "src/main.rs"

[[bin]]
name = "temporal-worker"
path = "src/temporal_main.rs"

[lib]
name = "worker"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bike-core = { path = "../bike-core" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sea-orm = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-sdk = { workspace = true }
temporalio-workflow = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
