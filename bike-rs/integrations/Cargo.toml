[package]
name = "integrations"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
bike-core = { path = "../bike-core" }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
base64 = "0.22.1"
dotenvy = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
http-body-util = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
strava-sdk = { path = "../strava-sdk" }

[dev-dependencies]
url = "2.5"
bike-core = { path = "../bike-core", features = ["test-fixtures"] }
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
tempfile = "3.27.0"
tokio-stream = { version = "0.1", features = ["net"] }
sea-orm = { workspace = true, features = ["mock"] }

[features]
test-fixtures = ["bike-core/test-fixtures"]
