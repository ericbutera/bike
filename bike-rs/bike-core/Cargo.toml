[package]
name = "bike-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "bike_core"
path = "src/lib.rs"

[lints]
workspace = true

[features]
test-fixtures = ["sea-orm/mock", "opentelemetry_sdk/testing"]

[dependencies]
async-trait = { workspace = true }
temporalio-common = { workspace = true }
temporalio-client = { workspace = true }
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
jsonwebtoken = "9.3"
oauth2 = "4.4"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
open-feature = "0.2.7"
thiserror = "2"
url = "2.5"
validator = { version = "0.18", features = ["derive"] }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
prometheus = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
roxmltree = "0.20"
fitparser = "0.11"
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10.3"
base64 = "0.22.1"
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
png = "0.17"
lru = "0.12"
uuid = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
migration = { path = "../migration" }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3.27.0"
sea-orm = { workspace = true, features = ["mock"] }
