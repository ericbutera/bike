name: bike-rust

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: 'bike'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${BIKE_RUST_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bike']
      interval: 2s
      timeout: 3s
      retries: 30

  migration:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    command: ['cargo', 'run', '--locked', '--bin', 'migration', '--', 'up']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  bike-rs:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
      RUST_LOG: info,sea_orm=trace,sqlx=warn,tower_http=trace
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${BIKE_RUST_UI_PORT:-3001}
      FRONTEND_URL: http://localhost:${BIKE_RUST_UI_PORT:-3001}
      API_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_OAUTH_SCOPES: activity:read_all
      LOCAL_ADMIN_ENABLED: ${LOCAL_ADMIN_ENABLED:-true}
      OAUTH_PROVIDERS: dev
      OAUTH_DEV_ENABLED: 'true'
      OAUTH_DEV_EMAIL: developer@bike.local
      OAUTH_DEV_NAME: Local Developer
      OAUTH_DEV_SUBJECT: bike-local-dev
      JWT_SECRET: change_me_in_dev
      APP_NAME: 'Bike'
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: noreply@bike.local
      SMTP_FROM_NAME: 'Bike'
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - '${BIKE_RUST_API_PORT:-3000}:3000'
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
      RUST_LOG: info,sea_orm=trace,sqlx=warn
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_OAUTH_SCOPES: activity:read_all
      APP_NAME: 'Bike'
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: noreply@bike.local
      SMTP_FROM_NAME: 'Bike'
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - .:/app

  ui:
    build:
      context: ../bike-ui
      dockerfile: Dockerfile.dev
    environment:
      API_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}/api
      CDN_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}/uploads
      INTERNAL_API_URL: http://bike-rs:3000/api
      MAP_RENDERER_URL: http://bike-maps:3100
      MAP_SERVICE_TOKEN: ${MAP_SERVICE_TOKEN:-}
    depends_on:
      bike-rs:
        condition: service_started
    ports:
      - '${BIKE_RUST_UI_PORT:-3001}:3000'
    volumes:
      - ../bike-ui:/app
      - ui_next_node_modules:/app/node_modules

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles:
      - tracing
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '${BIKE_RUST_JAEGER_UI_PORT:-16686}:16686'
      - '${BIKE_RUST_JAEGER_GRPC_PORT:-4317}:4317'
      - '${BIKE_RUST_JAEGER_HTTP_PORT:-4318}:4318'

volumes:
  postgres_data:
    name: ${BIKE_RUST_POSTGRES_VOLUME:-bike_postgres_data}
  ui_next_node_modules:
