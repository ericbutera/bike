name: bike-rust

services:
  postgres:
    image: ${BIKE_POSTGRES_IMAGE:-postgres:17.11-trixie@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b}
    environment:
      POSTGRES_DB: 'bike'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${BIKE_RUST_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bike']
      interval: 2s
      timeout: 3s
      retries: 30

  migration:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.99.0-trixie@sha256:6ff07edce8775d0f64be7aba9197229407301bddf2054d62c27b541a6238a181}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:-2.8.0}
        MISE_IMAGE: ${MISE_IMAGE:-ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6}
        PROTOC_VERSION: ${PROTOC_VERSION:-36.2}
    command: ['cargo', 'run', '--locked', '--bin', 'migration', '--', 'up']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  bike-rs:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.99.0-trixie@sha256:6ff07edce8775d0f64be7aba9197229407301bddf2054d62c27b541a6238a181}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:-2.8.0}
        MISE_IMAGE: ${MISE_IMAGE:-ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6}
        PROTOC_VERSION: ${PROTOC_VERSION:-36.2}
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
      RUST_LOG: info,sea_orm=trace,sqlx=warn,tower_http=trace
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${BIKE_RUST_UI_PORT:-3001}
      FRONTEND_URL: http://localhost:${BIKE_RUST_UI_PORT:-3001}
      API_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_OAUTH_SCOPES: activity:read_all
      LOCAL_ADMIN_ENABLED: ${LOCAL_ADMIN_ENABLED:-true}
      OAUTH_PROVIDERS: dev
      OAUTH_DEV_ENABLED: 'true'
      OAUTH_DEV_EMAIL: developer@bike.local
      OAUTH_DEV_NAME: Local Developer
      OAUTH_DEV_SUBJECT: bike-local-dev
      JWT_SECRET: change_me_in_dev
      APP_NAME: 'Bike'
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: noreply@bike.local
      SMTP_FROM_NAME: 'Bike'
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - '${BIKE_RUST_API_PORT:-3000}:3000'
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.dev
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.99.0-trixie@sha256:6ff07edce8775d0f64be7aba9197229407301bddf2054d62c27b541a6238a181}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:-2.8.0}
        MISE_IMAGE: ${MISE_IMAGE:-ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6}
        PROTOC_VERSION: ${PROTOC_VERSION:-36.2}
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bike
      RUST_LOG: info,sea_orm=trace,sqlx=warn
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      STRAVA_CLIENT_ID: ''
      STRAVA_CLIENT_SECRET: ''
      STRAVA_OAUTH_SCOPES: activity:read_all
      APP_NAME: 'Bike'
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: noreply@bike.local
      SMTP_FROM_NAME: 'Bike'
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - .:/app

  ui:
    build:
      context: ../bike-ui
      dockerfile: Dockerfile.dev
      args:
        NODE_ALPINE_IMAGE: ${NODE_ALPINE_IMAGE:-node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1}
        NPM_VERSION: ${NPM_VERSION:-12.2.0}
        PNPM_VERSION: ${PNPM_VERSION:-12.9.1}
    environment:
      API_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}/api
      CDN_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}/uploads
      INTERNAL_API_URL: http://bike-rs:3000/api
      MAP_RENDERER_URL: http://bike-maps:3100
      MAP_SERVICE_TOKEN: ${MAP_SERVICE_TOKEN:-}
    depends_on:
      bike-rs:
        condition: service_started
    ports:
      - '${BIKE_RUST_UI_PORT:-3001}:3000'
    volumes:
      - ../bike-ui:/app
      - ui_next_node_modules:/app/node_modules

  jaeger:
    image: ${BIKE_TRACING_IMAGE:-cr.jaegertracing.io/jaegertracing/jaeger:2.22.0}
    profiles:
      - tracing
    ports:
      - '${BIKE_RUST_JAEGER_UI_PORT:-16686}:16686'
      - '${BIKE_RUST_JAEGER_GRPC_PORT:-4317}:4317'
      - '${BIKE_RUST_JAEGER_HTTP_PORT:-4318}:4318'

volumes:
  postgres_data:
    name: ${BIKE_RUST_POSTGRES_VOLUME:-bike_postgres_data}
  ui_next_node_modules:
