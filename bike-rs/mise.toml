[env]
# Cargo fingerprints compiler flags. All ordinary tasks must use the same flags
# without changing coverage's separate instrumentation flags or target.
RUSTFLAGS = "-D warnings"
RUSTDOCFLAGS = "-D warnings"

[tasks."hooks:install"]
description = "Install prek Git hooks for this repository"
run = "mise --cd .. run hooks:install"

[tasks."format:staged"]
description = "Run prek on staged files"
run = "mise --cd .. run format:staged"

[tasks."ui:dev"]
description = "Start the shared Bike Next frontend"
run = "mise --cd ../bike-ui run dev"

[tasks."api:dev"]
description = "Start the bike API"
run = "cargo run --bin api"

[tasks."api:build"]
description = "Build the bike API"
run = "cargo build --release --bin api"

[tasks."worker:dev"]
description = "Start the bike worker"
run = "cargo run --bin worker"

[tasks."tracing:dev"]
description = "Start lightweight local tracing with Jaeger"
run = "docker compose --profile tracing up jaeger"

[tasks."compose:up"]
description = "Start the Rust Bike Compose stack"
depends = ["services:up"]
run = "docker compose up --build"

[tasks."compose:config"]
description = "Validate the Rust Bike Compose stack"
run = "docker compose config"

[tasks."services:up"]
description = "Start the shared Bike map service"
run = "mise --cd .. run compose:up"

[tasks."migration:up"]
description = "Run bike database migrations"
dir = "migration"
run = "cargo run -- up"

[tasks.test]
description = "Run Rust unit tests with coverage, then integration tests and doctests"
run = ["mise run coverage:unit", "mise run test:non-unit"]

[tasks."test:non-unit"]
description = "Run existing Rust integration tests and doctests without repeating unit tests"
env = { RUSTFLAGS = "-D warnings", RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo test --workspace --locked --test '*'",
  "cargo test --workspace --locked --doc",
]

[tasks."test:ci"]
description = "Collect Rust unit coverage and run integrations after shared CI preparation"
run = ["mise run coverage:unit:collect", "mise run test:non-unit"]

[tasks."test:workers"]
description = "Run focused queue, pipeline history, and worker metric regressions"
env = { RUSTFLAGS = "-D warnings" }
run = [
  "cargo test -p bike-core --lib background_jobs",
  "cargo test -p bike-core --lib analytics::tests::stale",
  "cargo test -p bike-core --lib queued_archive",
  "cargo test -p worker --lib pipeline_",
  "cargo test -p worker --bin worker pipeline_sampler",
  "cargo test -p api --lib request_receipt_and_id_are_preserved_in_enqueued_work",
  "cargo test -p api --lib load_cached_rows_for_request_rebuilds_dirty_cache_before_returning",
  "cargo test -p api --test platform owner_upload_and_admin_trace_and_replay_run_to_completion",
]

[tasks."test:workers:postgres"]
description = "Verify pipeline migration, concurrent claims, and retry history in disposable PostgreSQL"
env = { RUSTFLAGS = "-D warnings" }
run = '''
: "${BIKE_WORKER_TEST_DATABASE_URL:?Set this to a disposable PostgreSQL database}"
cargo test -p bike-core --test worker_history_postgres -- --ignored --nocapture
'''

[tasks."test:strava:postgres"]
description = "Verify native Strava DAGs, effects, retries, and vendor request counts"
env = { RUSTFLAGS = "-D warnings" }
run = '''
: "${BIKE_STRAVA_TEST_DATABASE_URL:?Set this to a disposable PostgreSQL database}"
cargo test -p api --test strava_workflows_postgres -- --ignored --nocapture
'''

[tasks."coverage:strava:postgres"]
description = "Collect native Strava PostgreSQL workflow coverage"
env = { RUSTFLAGS = "-D warnings", CARGO_LLVM_COV_DENY_WARNINGS = "1" }
run = [
  "mise exec rust protoc aqua:taiki-e/cargo-llvm-cov -- cargo llvm-cov -p api --locked --no-report --test strava_workflows_postgres -- --ignored --nocapture",
]

[tasks.coverage]
description = "Run Rust tests once and generate HTML, LCOV, and JSON coverage reports"
env = { RUSTFLAGS = "-D warnings", CARGO_LLVM_COV_DENY_WARNINGS = "1" }
run = [
  "mise install rust protoc aqua:taiki-e/cargo-llvm-cov",
  "mise exec rust protoc aqua:taiki-e/cargo-llvm-cov -- cargo llvm-cov clean --workspace",
  "mise exec rust protoc aqua:taiki-e/cargo-llvm-cov -- cargo llvm-cov --workspace --locked --no-report",
  "mise run coverage:report",
]

[tasks."coverage:unit"]
description = "Collect Rust unit coverage without integration tests or doctests"
env = { RUSTFLAGS = "-D warnings", CARGO_LLVM_COV_DENY_WARNINGS = "1" }
run = [
  "mise install rust protoc aqua:taiki-e/cargo-llvm-cov",
  "mise exec rust protoc aqua:taiki-e/cargo-llvm-cov -- cargo llvm-cov clean --workspace",
  "mise run coverage:unit:collect",
  "mise run coverage:report",
]

[tasks."coverage:unit:collect"]
description = "Collect unit measurements without cleaning another concurrent stage's profiles"
env = { RUSTFLAGS = "-D warnings", CARGO_LLVM_COV_DENY_WARNINGS = "1" }
run = "mise exec rust protoc aqua:taiki-e/cargo-llvm-cov -- cargo llvm-cov --workspace --locked --lib --bins --no-report"

[tasks."coverage:report"]
description = "Render API, worker, and shared-core coverage from one test run"
env = { CARGO_LLVM_COV_DENY_WARNINGS = "1" }
run = ["mise install jq", "mise exec jq -- bash ../scripts/coverage-rust-report.sh"]

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt --package bike-core --package api --package worker --package migration"

[tasks."test:heatmaps:postgres"]
description = "Run heatmap regressions against a disposable PostgreSQL database"
run = '''
: "${BIKE_HEATMAP_TEST_DATABASE_URL:?Set this to a disposable PostgreSQL database}"
cargo test -p bike-core --test heatmaps_postgres -- --ignored
'''

[tasks."fmt:check"]
description = "Check Rust formatting without writing changes"
run = [
  "cargo fmt --package bike-core --package api --package worker --package migration --check",
]

[tasks.lint]
description = "Run Rust Clippy checks"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."openapi:react-query"]
description = "Generate the shared UI TypeScript client from the common OpenAPI contract"
depends = ["generate:openapi"]
run = "mise --cd ../bike-ui run generate:typescript"

[tasks."generate:openapi"]
description = "Generate the common OpenAPI contract from Rust Utoipa"
run = "cargo run -p api --bin openapi"

[tasks."generate:typescript"]
description = "Generate the frontend TypeScript API contract from OpenAPI"
run = "mise --cd ../bike-ui run generate:typescript"

[tasks."test:integration"]
description = "Run native API integration tests with isolated fixtures"
run = "cargo test -p api --test platform"

[tasks."test:maps"]
description = "Check map image caching and native API-to-snapshot-worker contracts"
env = { RUSTFLAGS = "-D warnings" }
run = ["cargo test -p bike-core activity_maps --lib", "cargo test -p api --test platform map_image"]

[tasks."test:ingestion:postgres"]
description = "Verify ingestion migration and execution constraints in disposable PostgreSQL"
run = '''
: "${BIKE_INGESTION_TEST_DATABASE_URL:?Set this to a disposable PostgreSQL database}"
cargo test -p migration postgres_migration_enforces_active_execution_uniqueness_and_preserves_history -- --ignored
'''

[tasks."imports:recover"]
description = "Inspect or recover an owned batch of Bike-generated Strava TCX imports"
usage = '''
flag "--user-id <user-id>" required=#true
flag "--after-id <after-id>" default="0"
flag "--limit <limit>" default="32"
flag "--apply"
flag "--refresh-recent"
flag "--cleanup"
flag "--withhold-unrecovered"
flag "--refresh-recording"
flag "--register-manifest <register-manifest>"
'''
run = '''
set -- --user-id "${usage_user_id?}" --after-id "${usage_after_id?}" --limit "${usage_limit?}"
if [ "${usage_apply:-false}" = "true" ]; then set -- "$@" --apply; fi
if [ "${usage_refresh_recent:-false}" = "true" ]; then set -- "$@" --refresh-recent; fi
if [ "${usage_cleanup:-false}" = "true" ]; then set -- "$@" --cleanup; fi
if [ "${usage_withhold_unrecovered:-false}" = "true" ]; then set -- "$@" --withhold-unrecovered; fi
if [ "${usage_refresh_recording:-false}" = "true" ]; then set -- "$@" --refresh-recording; fi
if [ -n "${usage_register_manifest:-}" ]; then set -- "$@" --register-manifest "$usage_register_manifest"; fi
cargo run -p bike-core --bin recover-generated-imports -- "$@"
'''
