[tasks."hooks:install"]
description = "Install prek Git hooks for this repository"
run = "mise --cd .. run hooks:install"

[tasks."format:staged"]
description = "Run prek on staged files"
run = "mise --cd .. run format:staged"

[tasks."ui:dev"]
description = "Start the shared Bike Next frontend"
run = "mise --cd ../bike-ui run dev"

[tasks."api:dev"]
description = "Start the bike API"
run = "cargo run --bin api"

[tasks."api:build"]
description = "Build the bike API"
run = "cargo build --release --bin api"

[tasks."e2e:build"]
description = "Compile API, worker, and disposable database fixture tools for browser tests"
run = "cargo build --locked --bin api --bin worker --bin e2e-fixture"

[tasks."worker:dev"]
description = "Start the bike worker"
run = "cargo run --bin worker"

[tasks."tracing:dev"]
description = "Start lightweight local tracing with Jaeger"
run = "docker compose --profile tracing up jaeger"

[tasks."compose:up"]
description = "Start the Rust Bike Compose stack"
depends = ["services:up"]
run = "docker compose up --build"

[tasks."compose:config"]
description = "Validate the Rust Bike Compose stack"
run = "docker compose config"

[tasks."services:up"]
description = "Start the shared Bike map service"
run = "mise --cd .. run compose:up"

[tasks."migration:up"]
description = "Run bike database migrations"
dir = "migration"
run = "cargo run -- up"

[tasks.test]
description = "Run bike Rust tests"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo fmt --all"

[tasks."test:heatmaps:postgres"]
description = "Run heatmap regressions against a disposable PostgreSQL database"
run = '''
: "${BIKE_HEATMAP_TEST_DATABASE_URL:?Set this to a disposable PostgreSQL database}"
cargo test -p bike-core --test heatmaps_postgres -- --ignored
'''

[tasks."fmt:check"]
description = "Check Rust formatting without writing changes"
run = [
  "cargo fmt --all --check",
]

[tasks.lint]
description = "Run Rust Clippy checks"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."openapi:react-query"]
description = "Generate the shared UI TypeScript client from the common OpenAPI contract"
depends = ["generate:openapi"]
run = "mise --cd ../bike-ui run generate:typescript"

[tasks."generate:openapi"]
description = "Generate the common OpenAPI contract from Rust Utoipa"
run = "cargo run -p api --bin openapi"

[tasks."openapi:check"]
description = "Check the canonical HTTP contract against Rust Utoipa"
run = '''
set -eu
GENERATED_CONTRACTS="$(mktemp -d)"
trap 'rm -rf "$GENERATED_CONTRACTS"' EXIT
cargo run -p api --bin openapi -- "$GENERATED_CONTRACTS"
cmp -- "$GENERATED_CONTRACTS/openapi.json" ../contracts/openapi/openapi.json
cmp -- "$GENERATED_CONTRACTS/openapi.yaml" ../contracts/openapi/openapi.yaml
'''

[tasks."generate:protobuf"]
description = "Regenerate Strava gateway Rust protobuf client bindings in the Cargo build directory"
run = "cargo check -p bike-core"

[tasks."generate:typescript"]
description = "Generate the frontend TypeScript API contract from OpenAPI"
run = "mise --cd ../bike-ui run generate:typescript"

[tasks."openapi:typescript:check"]
description = "Check the generated frontend TypeScript API contract is fresh"
run = "mise --cd ../bike-ui run openapi:check"

[tasks."test:integration"]
description = "Run native API integration tests with isolated fixtures"
run = "cargo test -p api --test platform"

[tasks."imports:recover"]
description = "Inspect or recover an owned batch of Bike-generated Strava TCX imports"
usage = '''
flag "--user-id <user-id>" required=#true
flag "--after-id <after-id>" default="0"
flag "--limit <limit>" default="32"
flag "--apply"
flag "--refresh-recent"
flag "--cleanup"
flag "--withhold-unrecovered"
flag "--refresh-recording"
flag "--register-manifest <register-manifest>"
'''
run = '''
set -- --user-id "${usage_user_id?}" --after-id "${usage_after_id?}" --limit "${usage_limit?}"
if [ "${usage_apply:-false}" = "true" ]; then set -- "$@" --apply; fi
if [ "${usage_refresh_recent:-false}" = "true" ]; then set -- "$@" --refresh-recent; fi
if [ "${usage_cleanup:-false}" = "true" ]; then set -- "$@" --cleanup; fi
if [ "${usage_withhold_unrecovered:-false}" = "true" ]; then set -- "$@" --withhold-unrecovered; fi
if [ "${usage_refresh_recording:-false}" = "true" ]; then set -- "$@" --refresh-recording; fi
if [ -n "${usage_register_manifest:-}" ]; then set -- "$@" --register-manifest "$usage_register_manifest"; fi
cargo run -p bike-core --bin recover-generated-imports -- "$@"
'''
