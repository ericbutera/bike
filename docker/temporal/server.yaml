log:
  stdout: true
  level: info

persistence:
  numHistoryShards: 4
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: postgres:5432
        connectProtocol: tcp
        user: postgres
        password: postgres
        maxConns: 10
        maxIdleConns: 10
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: postgres:5432
        connectProtocol: tcp
        user: postgres
        password: postgres
        maxConns: 5
        maxIdleConns: 5

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: 127.0.0.1

services:
  frontend:
    rpc:
      grpcPort: 7233
      httpPort: 7243
      membershipPort: 6933
      bindOnIP: 0.0.0.0
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 127.0.0.1
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 127.0.0.1
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 127.0.0.1

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcAddress: 127.0.0.1:7233

publicClient:
  hostPort: 127.0.0.1:7233

dynamicConfigClient:
  filepath: /etc/temporal/config/dynamicconfig.yaml
  pollInterval: 10s
