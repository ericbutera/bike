# No development overlay, host ports, source mounts or globally named volumes.
services:
  postgres:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1g
  bike-rs:
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      default:
        aliases: [api.e2e.test]
    volumes:
      - uploads:/app/uploads
      - ${BIKE_E2E_MAP_CACHE:-map_image_cache}:/cache
    env_file: ./docker/api.e2e.env
  ui:
    volumes:
      - ${BIKE_E2E_UI_CACHE:-ui_image_cache}:/app/.next/cache/images
    networks:
      default:
        aliases: [ui.e2e.test]
    env_file: ./docker/ui.e2e.env
  bike-maps:
    volumes:
      - map_styles:/app/styles:ro
volumes:
  uploads:
  map_styles:
  ui_image_cache:
