# One monorepo checkout feeds every check, image build, and IaC apply below.
when:
  - event: [push, pull_request]
    branch: main
    path:
      include:
        - bike-rs/**
        - bike-ui/**
        - contracts/**
        - proto/**
        - map-renderer/**
        - integration-tests/**
        - .dockerignore
        - strava-gateway/**
        - mise.toml
        - bin/mise
        - .woodpecker/**
      on_empty: false
  - event: manual

# Release ancestry requires complete source history. Woodpecker mounts this
# checkout into every step in the workflow.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: test-contracts
    image: buildpack-deps:bookworm
    depends_on: []
    environment: &mise_environment
      MISE_DATA_DIR: /cache/bike/mise
      MISE_CACHE_DIR: /cache/bike/mise-cache
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: /woodpecker/src
      MISE_YES: "1"
    volumes: &mise_cache
      - woodpecker-cache:/cache
    commands:
      - ./bin/mise run ci:contracts

  - name: test-rust
    image: buildpack-deps:bookworm
    depends_on: []
    environment:
      <<: *mise_environment
      TEST_MODE: "1"
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      CARGO_TARGET_DIR: /cache/bike/target
    volumes:
      - woodpecker-cache:/cache
    commands:
      - ./bin/mise run ci:rust

  - name: test-ui
    image: buildpack-deps:bookworm
    depends_on: []
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - ./bin/mise run ci:ui

  - name: test-map-renderer
    image: buildpack-deps:bookworm
    depends_on: []
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - ./bin/mise run ci:renderer

  - name: test-strava-gateway
    image: buildpack-deps:bookworm
    depends_on: []
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - ./bin/mise run ci:gateway

  - name: build-api
    image: woodpeckerci/plugin-kaniko
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
    settings:
      registry: registry.registry:5000
      repo: bike-api
      tags: ${CI_COMMIT_SHA},latest
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: bike-rs
      dockerfile: bike-rs/api/Dockerfile
      cache: true
      cache_repo: bike-rust-cache

  - name: build-worker
    image: woodpeckerci/plugin-kaniko
    depends_on: [build-api, build-ui, build-map-renderer, build-strava-gateway]
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
    settings:
      registry: registry.registry:5000
      repo: bike-worker
      tags: ${CI_COMMIT_SHA},latest
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: bike-rs
      dockerfile: bike-rs/worker/Dockerfile
      cache: true
      cache_repo: bike-rust-cache

  - name: build-ui
    image: woodpeckerci/plugin-kaniko
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    settings:
      registry: registry.registry:5000
      repo: bike-ui
      tags: ${CI_COMMIT_SHA}
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: bike-ui
      dockerfile: bike-ui/Dockerfile

  - name: build-map-renderer
    image: woodpeckerci/plugin-kaniko
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    settings:
      registry: registry.registry:5000
      repo: bike-services
      tags: ${CI_COMMIT_SHA}
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: .
      dockerfile: map-renderer/Dockerfile

  - name: build-strava-gateway
    image: woodpeckerci/plugin-kaniko
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    settings:
      registry: registry.registry:5000
      repo: bike-services-strava-gateway
      tags: ${CI_COMMIT_SHA}
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: strava-gateway
      dockerfile: strava-gateway/Dockerfile

  - name: build-synthetics
    image: woodpeckerci/plugin-kaniko
    depends_on: [test-map-renderer, test-contracts]
    settings:
      registry: registry.registry:5000
      repo: bike-synthetics
      tags: ${CI_COMMIT_SHA}
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: integration-tests
      dockerfile: integration-tests/Dockerfile

  - name: deploy
    when:
      - event: [push, manual]
        branch: main
    image: buildpack-deps:bookworm
    depends_on:
      [
        build-api,
        build-worker,
        build-ui,
        build-map-renderer,
        build-strava-gateway,
      ]
    environment:
      <<: *mise_environment
      PULUMI_ACCESS_TOKEN:
        from_secret: pulumi_access_token
      GITHUB_TOKEN:
        from_secret: github_token
      PULUMI_IAC_REPO:
        from_secret: pulumi_iac_repo
      IAC_DEPLOY_SSH_KEY:
        from_secret: iac_deploy_ssh_key
    volumes: *mise_cache
    commands:
      - ./bin/mise run ci:deploy

  - name: synthetic-smoke
    when:
      - event: [push, manual]
        branch: main
    image: registry.registry:5000/bike-synthetics:${CI_COMMIT_SHA}
    depends_on: [deploy, build-synthetics]
    environment:
      BIKE_UI_URL: http://ui.bike.svc.cluster.local:3000
      BIKE_API_URL: http://api.bike.svc.cluster.local:3000/api
