# One monorepo checkout feeds every check, image build, and IaC apply below.
when:
  - event: [push, pull_request]
    branch: main
    path:
      include:
        - bike-rs/**
        - bike-ui/**
        - contracts/**
        - proto/**
        - map-renderer/**
        - integration-tests/**
        - scripts/**
        - .dockerignore
        - strava-gateway/**
        - mise.toml
        - .woodpecker/**
      on_empty: false
  - event: manual

# Keep the shared mise executable on PATH in every runner step.
workspace:
  base: /woodpecker
  path: src

# Release ancestry requires complete source history. Woodpecker mounts this
# checkout into every step in the workflow.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      partial: false
      depth: 0

steps:
  - name: test-contracts
    image: ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6
    depends_on: []
    environment: &mise_environment
      PATH: /woodpecker/src/.artifacts/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MISE_DATA_DIR: /cache/bike/mise
      MISE_CACHE_DIR: /cache/bike/mise-cache
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: /woodpecker/src
      MISE_YES: "1"
    volumes: &mise_cache
      - woodpecker-cache:/cache
    commands:
      - mise run ci:contracts

  - name: test-rust
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [test-contracts]
    environment:
      <<: *mise_environment
      TEST_MODE: "1"
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      CARGO_TARGET_DIR: /cache/bike/target
    volumes:
      - woodpecker-cache:/cache
    commands:
      - .artifacts/bin/mise run ci:rust

  - name: test-ui
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [test-contracts]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:ui

  - name: test-map-renderer
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [test-contracts]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:renderer

  - name: test-strava-gateway
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [test-contracts]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:gateway

  - name: build-api
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
    # Kaniko has no mise/bootstrap shell. Load the public pins prepared by the owning mise task.
    commands:
      - set -a; . .artifacts/image-build.env; exec /kaniko/plugin.sh
    environment:
      PLUGIN_BUILD_ARGS_FROM_ENV: RUST_IMAGE,RUNTIME_IMAGE,MISE_IMAGE,PROTOC_VERSION,CARGO_CHEF_REVISION
      PLUGIN_REGISTRY: registry.registry:5000
      PLUGIN_REPO: bike-api
      PLUGIN_TAGS: ${CI_COMMIT_SHA},latest
      PLUGIN_INSECURE: "true"
      PLUGIN_SKIP_TLS_VERIFY: "true"
      PLUGIN_INSECURE_PULL: "true"
      PLUGIN_INSECURE_REGISTRY: "true"
      PLUGIN_CONTEXT: bike-rs
      PLUGIN_DOCKERFILE: bike-rs/api/Dockerfile
      PLUGIN_CACHE: "true"
      PLUGIN_CACHE_REPO: bike-rust-cache

  - name: build-worker
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    depends_on: [build-api, build-ui, build-map-renderer, build-strava-gateway]
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
    # Kaniko has no mise/bootstrap shell. Load the public pins prepared by the owning mise task.
    commands:
      - set -a; . .artifacts/image-build.env; exec /kaniko/plugin.sh
    environment:
      PLUGIN_BUILD_ARGS_FROM_ENV: RUST_IMAGE,RUNTIME_IMAGE,MISE_IMAGE,PROTOC_VERSION,CARGO_CHEF_REVISION
      PLUGIN_REGISTRY: registry.registry:5000
      PLUGIN_REPO: bike-worker
      PLUGIN_TAGS: ${CI_COMMIT_SHA},latest
      PLUGIN_INSECURE: "true"
      PLUGIN_SKIP_TLS_VERIFY: "true"
      PLUGIN_INSECURE_PULL: "true"
      PLUGIN_INSECURE_REGISTRY: "true"
      PLUGIN_CONTEXT: bike-rs
      PLUGIN_DOCKERFILE: bike-rs/worker/Dockerfile
      PLUGIN_CACHE: "true"
      PLUGIN_CACHE_REPO: bike-rust-cache

  - name: build-ui
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    # Kaniko has no mise/bootstrap shell. Load the public pins prepared by the owning mise task.
    commands:
      - set -a; . .artifacts/image-build.env; exec /kaniko/plugin.sh
    environment:
      PLUGIN_BUILD_ARGS_FROM_ENV: NODE_ALPINE_IMAGE,NPM_VERSION,PNPM_VERSION
      PLUGIN_REGISTRY: registry.registry:5000
      PLUGIN_REPO: bike-ui
      PLUGIN_TAGS: ${CI_COMMIT_SHA}
      PLUGIN_INSECURE: "true"
      PLUGIN_SKIP_TLS_VERIFY: "true"
      PLUGIN_INSECURE_PULL: "true"
      PLUGIN_INSECURE_REGISTRY: "true"
      PLUGIN_CONTEXT: bike-ui
      PLUGIN_DOCKERFILE: bike-ui/Dockerfile

  - name: build-map-renderer
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    # Kaniko has no mise/bootstrap shell. Load the public pins prepared by the owning mise task.
    commands:
      - set -a; . .artifacts/image-build.env; exec /kaniko/plugin.sh
    environment:
      PLUGIN_BUILD_ARGS_FROM_ENV: NODE_IMAGE,NPM_VERSION,PLAYWRIGHT_IMAGE
      PLUGIN_REGISTRY: registry.registry:5000
      PLUGIN_REPO: bike-services
      PLUGIN_TAGS: ${CI_COMMIT_SHA}
      PLUGIN_INSECURE: "true"
      PLUGIN_SKIP_TLS_VERIFY: "true"
      PLUGIN_INSECURE_PULL: "true"
      PLUGIN_INSECURE_REGISTRY: "true"
      PLUGIN_CONTEXT: .
      PLUGIN_DOCKERFILE: map-renderer/Dockerfile

  - name: build-strava-gateway
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    depends_on:
      [
        test-contracts,
        test-rust,
        test-ui,
        test-map-renderer,
        test-strava-gateway,
      ]
    # Kaniko has no mise/bootstrap shell. Load the public pins prepared by the owning mise task.
    commands:
      - set -a; . .artifacts/image-build.env; exec /kaniko/plugin.sh
    environment:
      PLUGIN_BUILD_ARGS_FROM_ENV: GO_IMAGE,RUNTIME_IMAGE
      PLUGIN_REGISTRY: registry.registry:5000
      PLUGIN_REPO: bike-services-strava-gateway
      PLUGIN_TAGS: ${CI_COMMIT_SHA}
      PLUGIN_INSECURE: "true"
      PLUGIN_SKIP_TLS_VERIFY: "true"
      PLUGIN_INSECURE_PULL: "true"
      PLUGIN_INSECURE_REGISTRY: "true"
      PLUGIN_CONTEXT: strava-gateway
      PLUGIN_DOCKERFILE: strava-gateway/Dockerfile

  - name: build-synthetics
    image: woodpeckerci/plugin-kaniko:2.3.3@sha256:d6ecc0f37561503eeacd8f2189068c5a13c531f5629cf2ce2de0ac144824c9f4
    depends_on: [test-map-renderer, test-contracts]
    # Kaniko has no mise/bootstrap shell. Load the public pins prepared by the owning mise task.
    commands:
      - set -a; . .artifacts/image-build.env; exec /kaniko/plugin.sh
    environment:
      PLUGIN_BUILD_ARGS_FROM_ENV: K6_IMAGE
      PLUGIN_REGISTRY: registry.registry:5000
      PLUGIN_REPO: bike-synthetics
      PLUGIN_TAGS: ${CI_COMMIT_SHA}
      PLUGIN_INSECURE: "true"
      PLUGIN_SKIP_TLS_VERIFY: "true"
      PLUGIN_INSECURE_PULL: "true"
      PLUGIN_INSECURE_REGISTRY: "true"
      PLUGIN_CONTEXT: integration-tests
      PLUGIN_DOCKERFILE: integration-tests/Dockerfile

  - name: deploy
    when:
      - event: [push, manual]
        branch: main
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on:
      [
        build-api,
        build-worker,
        build-ui,
        build-map-renderer,
        build-strava-gateway,
      ]
    environment:
      <<: *mise_environment
      PULUMI_ACCESS_TOKEN:
        from_secret: pulumi_access_token
      GITHUB_TOKEN:
        from_secret: github_token
      PULUMI_IAC_REPO:
        from_secret: pulumi_iac_repo
      IAC_DEPLOY_SSH_KEY:
        from_secret: iac_deploy_ssh_key
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:deploy

  - name: synthetic-smoke
    when:
      - event: [push, manual]
        branch: main
    image: registry.registry:5000/bike-synthetics:${CI_COMMIT_SHA}
    depends_on: [deploy, build-synthetics]
    environment:
      BIKE_UI_URL: http://ui.bike.svc.cluster.local:3000
      BIKE_API_URL: http://api.bike.svc.cluster.local:3000/api
