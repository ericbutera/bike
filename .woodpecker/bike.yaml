# Owning checks and image builds feed the dependent E2E/deployment workflow.
when:
  - event: [push, pull_request]
    branch: main
    path:
      include:
        - bike-rs/**
        - bike-ui/**
        - contracts/**
        - proto/**
        - map-renderer/**
        - integration-tests/**
        - scripts/**
        - compose*.yaml
        - docker-bake.hcl
        - prek.toml
        - .dockerignore
        - strava-gateway/**
        - mise.toml
        - .woodpecker/**
      on_empty: false
  - event: manual

# Keep the shared mise executable on PATH in every runner step.
workspace:
  base: /woodpecker
  path: src

# Woodpecker mounts this checkout into every step in the workflow.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      partial: false
      depth: 0

steps:
  # Preparation shares tooling and image pins; it does not run product tests.
  - name: prepare
    failure: fail
    image: ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6
    depends_on: []
    environment: &mise_environment
      PATH: /woodpecker/src/.artifacts/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MISE_DATA_DIR: /cache/bike/mise
      MISE_CACHE_DIR: /cache/bike/mise-cache
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: /woodpecker/src
      MISE_YES: "1"
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      UV_CACHE_DIR: /cache/bike/uv
      BIKE_NODE_PACKAGE_CACHE: /cache/bike/node-packages
      XDG_RUNTIME_DIR: /cache/bike/node-packages/runtime
    volumes: &mise_cache
      - woodpecker-cache:/cache
    commands:
      - mise run ci:mise:prepare
      - mise run ci:cache:prepare

  - name: test-rust
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [prepare]
    environment:
      <<: *mise_environment
      TEST_MODE: "1"
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      CARGO_TARGET_DIR: /cache/bike/target
    volumes:
      - woodpecker-cache:/cache
    commands:
      - .artifacts/bin/mise run ci:rust

  - name: test-runtime-tooling
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:runtime

  - name: test-ui-unit
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:ui:unit

  - name: test-map-renderer
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:renderer

  - name: test-strava-gateway
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - .artifacts/bin/mise run ci:gateway

  - name: build-images
    image: ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6
    failure: fail
    depends_on:
      [
        test-rust,
        test-ui-unit,
        test-map-renderer,
        test-strava-gateway,
        test-runtime-tooling,
        coverage,
      ]
    environment:
      <<: *mise_environment
      BIKE_BUILDKIT_ADDR: tcp://bike-buildkit.woodpecker.svc.cluster.local:1234
      BIKE_BUILDKIT_CA:
        from_secret: buildkit_ca_cert
      BIKE_BUILDKIT_CERT:
        from_secret: buildkit_client_cert
      BIKE_BUILDKIT_KEY:
        from_secret: buildkit_client_key
    volumes: *mise_cache
    commands:
      - mise run ci:images

  - name: coverage
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [test-rust, test-ui-unit]
    environment:
      <<: *mise_environment
      TEST_MODE: "1"
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      CARGO_TARGET_DIR: /cache/bike/target
    volumes: *mise_cache
    commands:
      - mise run ci:coverage

  - name: publish-coverage
    failure: fail
    image: buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [coverage]
    when:
      - event: [push, manual]
        branch: main
        status: [success, failure]
    environment:
      <<: *mise_environment
      GITHUB_TOKEN:
        from_secret: github_token
    volumes: *mise_cache
    commands:
      - mise run coverage:publish
