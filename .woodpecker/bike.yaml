# One checkout owns checks, release images, acceptance, reports and deployment.
when:
  - event: [push, pull_request]
    branch: main
  - event: manual

concurrency: 1
workspace:
  base: /woodpecker
  path: src
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      partial: false
      depth: 0
services:
  - name: docker
    image: docker:29.4.0-dind@sha256:a6dd5322747a95cd8e3207bd8d415a8fd20ec34e9c00f06dc019cbd912013489
    privileged: true
    ports: [5432]
    environment:
      BIKE_E2E_ENGINE_STATE_DIR: /woodpecker/src/.artifacts/dind-state
    commands:
      - sh scripts/ci-e2e-engine.sh --insecure-registry=registry.registry:5000

steps:
  - name: prepare
    failure: fail
    image: ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6
    depends_on: []
    environment: &mise_environment
      PATH: /woodpecker/src/.artifacts/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MISE_DATA_DIR: /cache/bike/mise
      MISE_CACHE_DIR: /cache/bike/mise-cache
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: /woodpecker/src
      MISE_YES: "1"
      BIKE_STORAGE_METRICS_URL: http://kube-prom-stack-kube-prome-prometheus.observability.svc.cluster.local:9090
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      CARGO_TARGET_DIR: /cache/bike/target/shared
      CARGO_LLVM_COV_TARGET_DIR: /cache/bike/target/shared/llvm-cov-target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      UV_CACHE_DIR: /cache/bike/uv
      BIKE_NODE_PACKAGE_CACHE: /cache/bike/node-packages
      BIKE_GO_CACHE: /cache/bike/go
      XDG_RUNTIME_DIR: /cache/bike/node-packages/runtime
      DOCKER_HOST: unix:///woodpecker/src/.artifacts/dind-state/docker.sock
      DOCKER_CONFIG: /woodpecker/src/.artifacts/docker
      BIKE_E2E_ENGINE_STATE_DIR: /woodpecker/src/.artifacts/dind-state
    volumes: &mise_cache
      - woodpecker-cache:/cache
    commands:
      - mise run storage:ci
      - mise run ci:mise:prepare
      - mise run ci:cache:prepare
      - mise run ci:docker:prepare

  - name: test-rust
    failure: fail
    image: &checks_image buildpack-deps:trixie@sha256:3e5da0e17f858c9fe67dedfd9414b95df2bc8c31015df5230224637d43ba7e8c
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:rust

  - name: test-ui
    failure: fail
    image: *checks_image
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:ui:unit

  - name: test-maps
    failure: fail
    image: *checks_image
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:renderer

  - name: test-tooling
    failure: fail
    image: *checks_image
    depends_on: [prepare]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:runtime

  - name: test-postgres
    failure: fail
    image: *checks_image
    depends_on: [test-rust]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run test:postgres
      - mise run strava:sdk:check
      - mise run contracts:check

  - name: check-coverage
    failure: fail
    image: *checks_image
    depends_on: [test-rust, test-ui, test-maps]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:coverage

  - name: build-images
    failure: fail
    image: ghcr.io/jdx/mise:2026.10.3-debian@sha256:58c4c847f5518a9a87a9a582886a485443dbca5eb024426577f58d586a0990c6
    depends_on: [check-coverage, test-tooling, test-postgres]
    environment:
      <<: *mise_environment
      BIKE_BUILDKIT_ADDR: tcp://bike-buildkit.woodpecker.svc.cluster.local:1234
      BIKE_BUILDKIT_CA:
        from_secret: buildkit_ca_cert
      BIKE_BUILDKIT_CERT:
        from_secret: buildkit_client_cert
      BIKE_BUILDKIT_KEY:
        from_secret: buildkit_client_key
    volumes: *mise_cache
    commands:
      - mise run ci:images

  - name: test-images
    failure: fail
    image: *checks_image
    depends_on: [build-images]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - mise run ci:e2e

  - name: stop-engine
    failure: fail
    image: *checks_image
    depends_on: [test-images]
    when:
      - status: [success, failure]
    environment: *mise_environment
    volumes: *mise_cache
    commands:
      - bash scripts/ci-engine-stop.sh

  - name: deploy
    failure: fail
    image: *checks_image
    depends_on: [test-images, stop-engine]
    when:
      - event: [push, manual]
        branch: main
    environment:
      <<: *mise_environment
      PULUMI_ACCESS_TOKEN:
        from_secret: pulumi_access_token
      GITHUB_TOKEN:
        from_secret: github_token
      DEPLOYMENT_REPO:
        from_secret: deployment_repo
    volumes: *mise_cache
    commands:
      - mise run ci:deploy
