when:
  - event: [push, pull_request]
    branch: main
    # Keep the dependency present for gateway-only changes; its own steps
    # remain filtered to renderer changes.
    path:
      include:
        - map-renderer/**
        - proto/bike/maps/**
        - Dockerfile
        - .dockerignore
        - mise.toml
        - .woodpecker/deploy.sh
        - .woodpecker/map-renderer.yaml
        - strava-gateway/**
        - proto/bike/strava/**
        - .woodpecker/strava-gateway.yaml
      on_empty: false
  - event: manual
    evaluate: 'MANUAL_COMPONENT == "map-renderer" || MANUAL_COMPONENT == "strava-gateway"'

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: test
    when:
      - event: [push, pull_request]
        branch: main
        path: &owned_paths
          include:
            - map-renderer/**
            - proto/bike/maps/**
            - Dockerfile
            - .dockerignore
            - mise.toml
            - .woodpecker/deploy.sh
            - .woodpecker/map-renderer.yaml
          on_empty: false
      - event: manual
        evaluate: 'MANUAL_COMPONENT == "map-renderer"'
    image: node:25.2.1-alpine
    commands:
      - node --test map-renderer/*.test.mjs

  - name: build
    when: &release
      - event: push
        branch: main
        path: *owned_paths
      - event: manual
        evaluate: 'MANUAL_COMPONENT == "map-renderer"'
    image: woodpeckerci/plugin-kaniko
    depends_on: [test]
    settings:
      registry: registry.registry:5000
      repo: bike-services
      tags: ${CI_COMMIT_SHA}
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: .
      dockerfile: Dockerfile

  - name: deploy
    when: *release
    image: pulumi/pulumi-go:latest
    depends_on: [build]
    environment:
      PULUMI_ACCESS_TOKEN:
        from_secret: pulumi_access_token
      GITHUB_TOKEN:
        from_secret: github_token
      PULUMI_IAC_REPO:
        from_secret: pulumi_iac_repo
      IAC_DEPLOY_SSH_KEY:
        from_secret: iac_deploy_ssh_key
    commands:
      - sh .woodpecker/deploy.sh map-renderer
