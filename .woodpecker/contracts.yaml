when:
  - event: [push, pull_request]
    branch: main
    path:
      include:
        - bike-rs/**
        - bike-ui/**
        - contracts/**
        - proto/**
        - map-renderer/styles/**
        - strava-gateway/internal/provider/testdata/**
        - scripts/check-contracts.rb
        - scripts/audit-api-routes.rb
        - docs/shared-assets.json
        - docs/api-route-audit.json
        - mise.toml
        - .woodpecker/contracts.yaml
      on_empty: false
  - event: manual
    evaluate: 'MANUAL_COMPONENT == "contracts"'

steps:
  - name: check-contracts
    image: ruby:3.4.11-bookworm
    commands:
      - ruby scripts/check-contracts.rb
      - ruby scripts/audit-api-routes.rb
