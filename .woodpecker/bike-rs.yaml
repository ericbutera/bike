# Native Rust checks belong to this component.
# Publishing and deployment require owned changes or an explicit manual component.
when:
  - event: [push, pull_request]
    branch: main
    path:
      include:
        - bike-rs/**
        - contracts/**
        - proto/**
        - bike-ui/**
        - mise.toml
        - .woodpecker/deploy.sh
        - .woodpecker/bike-ui.yaml
        - .woodpecker/bike-rs.yaml
      on_empty: false
  # UI promotion waits for backend releases; UI-only selections do not publish a backend.
  - event: manual
    evaluate: 'MANUAL_COMPONENT == "bike-rs" || MANUAL_COMPONENT == "bike-ui"'

# Release ancestry uses the trusted clone plugin; deploy credentials are IaC-only.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: test-rust
    when: &native_changes
      - event: [push, pull_request]
        branch: main
        path:
          include:
            - bike-rs/**
            - contracts/**
            - proto/**
            - mise.toml
            - .woodpecker/deploy.sh
            - .woodpecker/bike-rs.yaml
          on_empty: false
      - event: manual
        evaluate: 'MANUAL_COMPONENT == "bike-rs"'
    image: rust:1-bookworm
    environment:
      TEST_MODE: "1"
      CARGO_HOME: /cache/bike/cargo
      RUSTUP_HOME: /cache/bike/rustup
      CARGO_TARGET_DIR: /cache/bike/target
    volumes:
      - woodpecker-cache:/cache
    commands:
      - cd bike-rs && sh .woodpecker/test-rust.sh

  - name: build-api
    when: &publish_changes
      - event: push
        branch: main
        path:
          include:
            - bike-rs/**
            - .woodpecker/deploy.sh
            - .woodpecker/bike-rs.yaml
          on_empty: false
      - event: manual
        evaluate: 'MANUAL_COMPONENT == "bike-rs"'
    image: woodpeckerci/plugin-kaniko
    depends_on: [test-rust]
    settings:
      registry: registry.registry:5000
      repo: bike-api
      tags: ${CI_COMMIT_SHA},latest
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: bike-rs
      dockerfile: bike-rs/api/Dockerfile
      cache: true
      cache_repo: bike-rust-cache

  - name: build-worker
    when: *publish_changes
    image: woodpeckerci/plugin-kaniko
    depends_on: [test-rust]
    settings:
      registry: registry.registry:5000
      repo: bike-worker
      tags: ${CI_COMMIT_SHA},latest
      insecure: true
      skip_tls_verify: true
      insecure-pull: true
      insecure-registry: true
      context: bike-rs
      dockerfile: bike-rs/worker/Dockerfile
      cache: true
      cache_repo: bike-rust-cache

  - name: deploy
    when: *publish_changes
    image: pulumi/pulumi-go:latest
    depends_on: [build-api, build-worker]
    environment:
      PULUMI_ACCESS_TOKEN:
        from_secret: pulumi_access_token
      GITHUB_TOKEN:
        from_secret: github_token
      PULUMI_IAC_REPO:
        from_secret: pulumi_iac_repo
      IAC_DEPLOY_SSH_KEY:
        from_secret: iac_deploy_ssh_key
    commands:
      - sh .woodpecker/deploy.sh bike-rs
