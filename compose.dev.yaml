# Development-only builds, source mounts, persistent storage and host ports.
services:
  postgres:
    ports:
      - "${BIKE_RUST_POSTGRES_PORT:-5432}:5432"
  migration:
    env_file: ./docker/dev-cache.env
    image: bike-dev-api
    build: &api_build
      context: ./bike-rs
      dockerfile: Dockerfile.dev
      target: api
      args:
        RUST_IMAGE: ${RUST_IMAGE:?Run Compose through mise}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:?Run Compose through mise}
        MISE_IMAGE: ${MISE_IMAGE:?Run Compose through mise}
        PROTOC_VERSION: ${PROTOC_VERSION:?Run Compose through mise}
    command: [cargo, run, --locked, --bin, migration, --, up]
    volumes:
      - ./bike-rs:/app:ro
      - build_storage:/cache
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/migration}
  bike-rs:
    env_file: ./docker/dev-cache.env
    image: bike-dev-api
    build: *api_build
    environment:
      RUST_LOG: info,sea_orm=trace,sqlx=warn,sqlx::query=debug,tower_http=trace
      CORS_ALLOWED_ORIGINS: http://localhost:${BIKE_RUST_UI_PORT:-3001}
      FRONTEND_URL: http://localhost:${BIKE_RUST_UI_PORT:-3001}
      API_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}
      LOCAL_ADMIN_ENABLED: ${LOCAL_ADMIN_ENABLED:-true}
      OAUTH_PROVIDERS: dev
      OAUTH_DEV_ENABLED: "true"
      OAUTH_DEV_EMAIL: developer@bike.local
      OAUTH_DEV_NAME: Local Developer
      OAUTH_DEV_SUBJECT: bike-local-dev
      MAP_IMAGE_CACHE_DIR: /cache/map-images
    ports:
      - "${BIKE_RUST_API_PORT:-3000}:3000"
    volumes:
      - ./bike-rs:/app:ro
      - build_storage:/cache
      - ${BIKE_UPLOADS_DIR:-uploads}:/app/uploads
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/api}
  ui:
    env_file: ./docker/dev-cache.env
    image: bike-dev-ui
    build:
      context: ./bike-ui
      dockerfile: Dockerfile.dev
      args:
        NODE_ALPINE_IMAGE: ${NODE_ALPINE_IMAGE:?Run Compose through mise}
        NPM_VERSION: ${NPM_VERSION:?Run Compose through mise}
        PNPM_VERSION: ${PNPM_VERSION:?Run Compose through mise}
    environment:
      API_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}/api
      CDN_URL: http://localhost:${BIKE_RUST_API_PORT:-3000}/uploads
    ports:
      - "${BIKE_RUST_UI_PORT:-3001}:3000"
    volumes:
      - build_storage:/cache
      - ${BIKE_DOCKER_STORAGE_ROOT:-/var/lib/docker/volumes/bike-build-storage/_data}/ui/next-env.d.ts:/app/next-env.d.ts
      - type: volume
        source: build_storage
        target: /app/node_modules
        volume: {nocopy: true, subpath: ui/node_modules}
      - type: volume
        source: build_storage
        target: /app/.next
        volume: {nocopy: true, subpath: ui/next}
      - type: volume
        source: build_storage
        target: /app/.artifacts
        volume: {nocopy: true, subpath: artifacts/ui}
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/ui}
    develop:
      watch:
        - action: sync
          path: ${BIKE_UI_SOURCE:-./bike-ui}
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - .artifacts/
            - .cache/
            - .scratch/
            - .pnpm-store/
            - next-env.d.ts
            - '*.tsbuildinfo'
            - .env*
            - .mise.local.toml
  bike-maps:
    env_file: ./docker/dev-cache.env
    volumes:
      - build_storage:/cache
      - type: volume
        source: build_storage
        target: /tmp
        volume: {nocopy: true, subpath: tmp/maps}
    build:
      context: .
      dockerfile: map-renderer/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Run Compose through mise}
        NPM_VERSION: ${NPM_VERSION:?Run Compose through mise}
        GO_IMAGE: ${GO_IMAGE:?Run Compose through mise}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Run Compose through mise}
  jaeger:
    image: ${BIKE_TRACING_IMAGE:?Run Compose through mise}
    profiles: [tracing]
    ports:
      - "${BIKE_RUST_JAEGER_UI_PORT:-16686}:16686"
      - "${BIKE_RUST_JAEGER_GRPC_PORT:-4317}:4317"
      - "${BIKE_RUST_JAEGER_HTTP_PORT:-4318}:4318"
volumes:
  uploads:
    name: ${BIKE_UPLOADS_VOLUME:-bike_uploads}
  postgres_data:
    name: ${BIKE_RUST_POSTGRES_VOLUME:-bike_postgres_data}
  build_storage:
    external: true
    name: bike-build-storage
