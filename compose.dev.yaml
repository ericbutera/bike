# Development-only builds, source mounts, persistent storage and host ports.
# Local Temporal shares PostgreSQL with Bike, using its own databases.
services:
  postgres:
    ports:
      - "${BIKE_RUST_POSTGRES_PORT:-5432}:5432"
  migration:
    env_file: ./docker/dev-cache.env
    image: bike-dev-api
    build: &api_build
      labels: { dev.bike.storage: disposable-image }
      context: ./bike-rs
      dockerfile: Dockerfile.dev
      target: api
      args:
        RUST_IMAGE: ${RUST_IMAGE:?Run Compose through mise}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:?Run Compose through mise}
        MISE_IMAGE: ${MISE_IMAGE:?Run Compose through mise}
        PROTOC_VERSION: ${PROTOC_VERSION:?Run Compose through mise}
    command: [cargo, run, --locked, --bin, migration, --, up]
    volumes:
      - ./bike-rs:/app:ro
      - build_storage:/cache
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/migration }
  bike-rs:
    env_file:
      - ./docker/dev-cache.env
      - ./docker/api.dev.env
    image: bike-dev-api
    build: *api_build
    ports:
      - "${BIKE_RUST_API_PORT:-3000}:3000"
    volumes:
      - ./bike-rs:/app:ro
      - build_storage:/cache
      - ${BIKE_UPLOADS_DIR:-uploads}:/app/uploads
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/api }
  ui:
    env_file:
      - ./docker/dev-cache.env
      - ./docker/ui.dev.env
    image: bike-dev-ui
    build:
      labels: { dev.bike.storage: disposable-image }
      context: ./bike-ui
      dockerfile: Dockerfile.dev
      args:
        NODE_ALPINE_IMAGE: ${NODE_ALPINE_IMAGE:?Run Compose through mise}
        NPM_VERSION: ${NPM_VERSION:?Run Compose through mise}
        PNPM_VERSION: ${PNPM_VERSION:?Run Compose through mise}
    ports:
      - "${BIKE_RUST_UI_PORT:-3001}:3000"
    volumes:
      - build_storage:/cache
      - ${BIKE_DOCKER_STORAGE_ROOT:-/var/lib/docker/volumes/bike-build-storage/_data}/ui/next-env.d.ts:/app/next-env.d.ts
      - type: volume
        source: build_storage
        target: /app/node_modules
        volume: { nocopy: true, subpath: ui/node_modules }
      - type: volume
        source: build_storage
        target: /app/.next
        volume: { nocopy: true, subpath: ui/next }
      - type: volume
        source: build_storage
        target: /app/.artifacts
        volume: { nocopy: true, subpath: artifacts/ui }
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/ui }
    develop:
      watch:
        - action: sync
          path: ${BIKE_UI_SOURCE:-./bike-ui}
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - .artifacts/
            - .cache/
            - .scratch/
            - .pnpm-store/
            - next-env.d.ts
            - "*.tsbuildinfo"
            - .env*
            - .mise.local.toml
  bike-maps:
    env_file: ./docker/dev-cache.env
    volumes:
      - build_storage:/cache
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/maps }
    build:
      labels: { dev.bike.storage: disposable-image }
      context: .
      dockerfile: map-renderer/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Run Compose through mise}
        NPM_VERSION: ${NPM_VERSION:?Run Compose through mise}
        GO_IMAGE: ${GO_IMAGE:?Run Compose through mise}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Run Compose through mise}
  jaeger:
    image: ${BIKE_TRACING_IMAGE:?Run Compose through mise}
    profiles: [tracing]
    ports:
      - "${BIKE_RUST_JAEGER_UI_PORT:-16686}:16686"
      - "${BIKE_RUST_JAEGER_GRPC_PORT:-4317}:4317"
      - "${BIKE_RUST_JAEGER_HTTP_PORT:-4318}:4318"
  temporal-worker:
    env_file: ./docker/dev-cache.env
    restart: unless-stopped
    image: bike-dev-worker
    build:
      labels: { dev.bike.storage: disposable-image }
      context: ./bike-rs
      dockerfile: Dockerfile.dev
      target: worker
      args:
        RUST_IMAGE: ${RUST_IMAGE:?Run Compose through mise}
        WATCHEXEC_VERSION: ${WATCHEXEC_VERSION:?Run Compose through mise}
        MISE_IMAGE: ${MISE_IMAGE:?Run Compose through mise}
        PROTOC_VERSION: ${PROTOC_VERSION:?Run Compose through mise}
    command: [cargo, run, --locked, --bin, temporal-worker]
    ports:
      - "127.0.0.1:${BIKE_TEMPORAL_WORKER_METRICS_PORT:-9092}:9092"
      - "127.0.0.1:${BIKE_TEMPORAL_PROVIDER_METRICS_PORT:-9093}:9091"
    volumes:
      - ./bike-rs:/app:ro
      - ${BIKE_UPLOADS_DIR:-uploads}:/app/uploads
      - build_storage:/cache
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/worker }
    stop_grace_period: 1m
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    profiles: !reset []
  temporal-databases:
    image: ${BIKE_POSTGRES_IMAGE:?Run Compose through mise}
    entrypoint: [psql]
    command:
      [
        --host=postgres,
        --username=postgres,
        --dbname=postgres,
        --set=ON_ERROR_STOP=1,
        --file=/setup/databases.sql,
      ]
    volumes:
      - ./docker/temporal/databases.sql:/setup/databases.sql:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/databases }
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./docker/postgres.env
  temporal-schema:
    image: ${BIKE_TEMPORAL_TOOLS_IMAGE:?Run Compose through mise}
    entrypoint: [sh, /setup/schema.sh]
    volumes:
      - ./scripts/temporal-schema.sh:/setup/schema.sh:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/schema }
    depends_on:
      temporal-databases:
        condition: service_completed_successfully
    env_file: ./docker/postgres.env
  temporal:
    image: ${BIKE_TEMPORAL_SERVER_IMAGE:?Run Compose through mise}
    command:
      [
        temporal-server,
        --config-file,
        /etc/temporal/config/server.yaml,
        --allow-no-auth,
        start,
      ]
    volumes:
      - ./docker/temporal/server.yaml:/etc/temporal/config/server.yaml:ro
      - ./docker/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/temporal }
    ports:
      - "127.0.0.1:${BIKE_TEMPORAL_PORT:-7233}:7233"
    stop_grace_period: 1m
    healthcheck:
      test:
        [
          CMD,
          wget,
          --quiet,
          --output-document=/dev/null,
          "http://127.0.0.1:7243/api/v1/system-info",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    entrypoint: !reset []
  temporal-namespace:
    image: ${BIKE_TEMPORAL_TOOLS_IMAGE:?Run Compose through mise}
    entrypoint: [sh, /setup/namespace.sh]
    volumes:
      - ./scripts/temporal-namespace.sh:/setup/namespace.sh:ro
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/namespace }
    depends_on:
      temporal:
        condition: service_healthy
    env_file: ./docker/temporal.env
  temporal-ui:
    image: ${BIKE_TEMPORAL_UI_IMAGE:?Run Compose through mise}
    volumes:
      - type: volume
        source: build_storage
        target: /tmp
        volume: { nocopy: true, subpath: tmp/temporal-ui }
    ports:
      - "127.0.0.1:${BIKE_TEMPORAL_UI_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    env_file: ./docker/temporal.env
  buildkit:
    image: ${BIKE_BUILDKIT_IMAGE:?Run Compose through mise}
    container_name: bike-buildkit
    privileged: true
    restart: unless-stopped
    command:
      [
        --oci-worker-snapshotter=overlayfs,
        --config=/etc/buildkit/buildkitd.toml,
      ]
    volumes:
      - build_storage:/cache
      - ./docker/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
      - type: volume
        source: build_storage
        target: /var/lib/buildkit
        volume:
          nocopy: true
          subpath: buildkit
      - type: volume
        source: build_storage
        target: /tmp
        volume:
          nocopy: true
          subpath: tmp/buildkit
    profiles:
      - tooling
volumes:
  uploads:
    name: ${BIKE_UPLOADS_VOLUME:-bike_uploads}
  postgres_data:
    name: ${BIKE_RUST_POSTGRES_VOLUME:-bike_postgres_data}
  build_storage:
    external: true
    name: bike-build-storage
