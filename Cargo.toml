[workspace]
members = [
  "bike-core",
  "api",
  "worker",
  "migration",
]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "2.0.0-rc.27", features = ["sqlx-postgres", "runtime-tokio-rustls", "tracing-spans"] }
sea-orm-migration = { version = "2.0.0-rc.27", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"
dotenvy = "0.15"
once_cell = "1.19"
prometheus = "0.14"
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
utoipa = { version = "5", features = ["axum_extras", "yaml"] }
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }
chrono = { version = "0.4", features = ["serde"] }
kaleido = "0.10.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.33.0"

[workspace.lints.clippy]
all = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
