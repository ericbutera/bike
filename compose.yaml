name: bike

include:
  - path: bike-rs/compose.yaml

services:
  bike-maps:
    build:
      context: .
      dockerfile: map-renderer/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24.21.0}
        NPM_VERSION: ${NPM_VERSION:-12.2.0}
    environment:
      MAP_IMAGE_CACHE_DIR: /cache
      MAP_IMAGE_CACHE_TTL_SECONDS: ${MAP_IMAGE_CACHE_TTL_SECONDS:-604800}
      MAP_SERVICE_TOKEN: ${MAP_SERVICE_TOKEN:-}
    volumes:
      - map_image_cache:/cache

volumes:
  map_image_cache:
