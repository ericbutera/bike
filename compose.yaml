# Image-based service contracts shared by development and disposable E2E.
services:
  postgres:
    image: ${BIKE_POSTGRES_IMAGE:?Run Compose through mise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - test -r "$${PGDATA}/postmaster.pid" && grep -q '^ready' "$${PGDATA}/postmaster.pid" && pg_isready -h 127.0.0.1 -U postgres -d postgres
      interval: 2s
      timeout: 3s
      retries: 30
    env_file: ./docker/postgres.env
  migration:
    image: ${BIKE_BACKEND_IMAGE:-bike-backend:review}
    command: [/app/migration, up]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./docker/database.env
  bike-rs:
    image: ${BIKE_BACKEND_IMAGE:-bike-backend:review}
    env_file:
      - ./docker/database.env
      - ./docker/temporal.env
      - ./docker/backend.env
      - ./docker/maps.env
      - ./docker/api.env
    volumes:
      - uploads:/app/uploads
      - ${BIKE_E2E_MAP_CACHE:-map_image_cache}:/cache
    depends_on:
      migration:
        condition: service_completed_successfully
  ui:
    image: ${BIKE_UI_IMAGE:-bike-ui:review}
    depends_on:
      bike-rs:
        condition: service_started
    env_file: ./docker/ui.env
  bike-maps:
    image: ${BIKE_RENDERER_IMAGE:-bike-map-renderer:review}
    env_file: ./docker/maps.env
  temporal-worker:
    profiles: [worker]
    image: ${BIKE_BACKEND_IMAGE:-bike-backend:review}
    command: [/app/temporal-worker]
    env_file:
      - ./docker/database.env
      - ./docker/temporal.env
      - ./docker/backend.env
    volumes:
      - uploads:/app/uploads
    stop_grace_period: 1m
    depends_on:
      temporal:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
  temporal:
    image: ${BIKE_TEMPORAL_TOOLS_IMAGE:?Run Compose through mise}
    entrypoint: [temporal]
    command:
      [
        server,
        start-dev,
        --ip,
        0.0.0.0,
        --namespace,
        bike,
        --search-attribute,
        BikeUserId=Keyword,
      ]
    healthcheck:
      test:
        [CMD, temporal, --address, "localhost:7233", operator, cluster, health]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
  map_image_cache:
  uploads:
