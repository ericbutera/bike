name: bike

include:
  - path: bike-rs/compose.yaml

services:
  bike-maps:
    build:
      context: .
      dockerfile: map-renderer/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.21.0-trixie@sha256:1278a37eb510ec1606fba0e80f554bcc941ae0b44f35ae373c4822ae7717c64d}
        NPM_VERSION: ${NPM_VERSION:-12.2.0}
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27}
    environment:
      MAP_IMAGE_CACHE_DIR: /cache
      MAP_IMAGE_CACHE_TTL_SECONDS: ${MAP_IMAGE_CACHE_TTL_SECONDS:-604800}
      MAP_SERVICE_TOKEN: ${MAP_SERVICE_TOKEN:-}
    volumes:
      - map_image_cache:/cache

volumes:
  map_image_cache:
