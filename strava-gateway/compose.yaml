name: bike-strava-gateway
services:
  postgres:
    image: ${STRAVA_GATEWAY_POSTGRES_IMAGE:-postgres:17.11-trixie@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b}
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_local_only
      POSTGRES_DB: gateway_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_test"]
      interval: 2s
      timeout: 2s
      retries: 15
