[tools]
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "v1.36.6"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "v1.5.1"
golangci-lint = "2.14.0"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go-mod"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

[tasks.test]
run = "go test -p 1 ./..."

[tasks.check]
description = "Run the shared gateway lint and fixture tests"
run = ["mise run lint", "mise run test"]

[tasks.lint]
description = "Run gateway formatting, Go vet, and golangci-lint"
run = ["golangci-lint fmt --diff", "go vet ./...", "golangci-lint run"]

[tasks.build]
run = ["go build ./cmd/gateway", "go build ./cmd/migrate", "go build ./cmd/worker", "go build ./cmd/admin", "go build ./cmd/import_rust", "go build ./cmd/export_rust"]

[tasks."generate:protobuf"]
description = "Regenerate the checked-in gateway protobuf and gRPC bindings"
run = 'protoc -I ../proto --go_out=. --go_opt=module=github.com/ericbutera/bike-services/strava-gateway --go-grpc_out=. --go-grpc_opt=module=github.com/ericbutera/bike-services/strava-gateway ../proto/bike/strava/v1/gateway.proto'

[tasks."generate:protobuf:check"]
description = "Check the checked-in gateway protobuf and gRPC bindings"
run = '''
set -eu
output_dir=$(mktemp -d)
trap 'rm -rf "$output_dir"' EXIT
protoc -I ../proto --go_out="$output_dir" --go_opt=module=github.com/ericbutera/bike-services/strava-gateway --go-grpc_out="$output_dir" --go-grpc_opt=module=github.com/ericbutera/bike-services/strava-gateway ../proto/bike/strava/v1/gateway.proto
cmp "$output_dir/gen/bike/strava/v1/gateway.pb.go" gen/bike/strava/v1/gateway.pb.go
cmp "$output_dir/gen/bike/strava/v1/gateway_grpc.pb.go" gen/bike/strava/v1/gateway_grpc.pb.go
'''

[tasks."db:migrate"]
run = "go run ./cmd/migrate"
