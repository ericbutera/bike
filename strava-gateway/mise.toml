[tools]
go = "1.25.1"
golangci-lint = "2.14.0"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go-mod"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

[tasks.test]
run = "go test -p 1 ./..."

[tasks.lint]
description = "Run gateway formatting, Go vet, and golangci-lint"
run = ["golangci-lint fmt --diff", "go vet ./...", "golangci-lint run"]

[tasks.build]
run = ["go build ./cmd/gateway", "go build ./cmd/migrate", "go build ./cmd/worker", "go build ./cmd/admin", "go build ./cmd/import_rust", "go build ./cmd/export_rust"]

[tasks."generate:protobuf"]
description = "Regenerate the checked-in gateway protobuf and gRPC bindings"
run = "mise --cd .. run generate:protobuf"

[tasks."generate:protobuf:check"]
description = "Check the checked-in gateway protobuf and gRPC bindings"
run = "mise --cd .. run generate:protobuf:check"

[tasks."db:migrate"]
run = "go run ./cmd/migrate"
