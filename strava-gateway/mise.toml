[tools]
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "v1.36.12"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "v1.6.2"
golangci-lint = "2.14.0"

[env]
GOTOOLCHAIN = "local"
GOCACHE = "{{get_env(name='BIKE_GO_CACHE', default=config_root ~ '/.cache')}}/go-build"
GOMODCACHE = "{{get_env(name='BIKE_GO_CACHE', default=config_root ~ '/.cache')}}/go-mod"
GOLANGCI_LINT_CACHE = "{{get_env(name='BIKE_GO_CACHE', default=config_root ~ '/.cache')}}/golangci-lint"

[tasks.test]
description = "Run gateway unit tests with coverage"
run = "mise run coverage"

[tasks."test:workers"]
description = "Run focused worker, trace propagation and storage fixtures"
run = "go test ./internal/worker ./internal/observability ./internal/storage"

[tasks.coverage]
description = "Generate service coverage with the shared native Go workflow"
run = "mise --cd .. run go:coverage strava-gateway"

[tasks."test:postgres"]
description = "Run existing opt-in gateway storage checks against an explicitly disposable database"
run = '''
: "${TEST_DATABASE_URL:?Set this to a disposable PostgreSQL database}"
go test -p 1 ./internal/storage
'''

[tasks.check]
description = "Run the shared gateway lint and fixture tests"
run = ["mise run lint", "mise run test"]

[tasks.lint]
description = "Run gateway formatting, Go vet, and golangci-lint"
run = ["golangci-lint fmt --diff", "go vet ./...", "golangci-lint run"]

[tasks.build]
run = ["go build ./cmd/gateway", "go build ./cmd/migrate", "go build ./cmd/worker", "go build ./cmd/admin", "go build ./cmd/import_rust", "go build ./cmd/export_rust"]

[tasks."generate:protobuf"]
description = "Regenerate the checked-in gateway protobuf and gRPC bindings"
run = 'protoc -I ../proto --go_out=. --go_opt=module=github.com/ericbutera/bike/strava-gateway --go-grpc_out=. --go-grpc_opt=module=github.com/ericbutera/bike/strava-gateway ../proto/bike/strava/v1/gateway.proto'

[tasks."generate:protobuf:check"]
description = "Check the checked-in gateway protobuf and gRPC bindings"
run = '''
set -eu
output_dir=$(mktemp -d)
trap 'rm -rf "$output_dir"' EXIT
protoc -I ../proto --go_out="$output_dir" --go_opt=module=github.com/ericbutera/bike/strava-gateway --go-grpc_out="$output_dir" --go-grpc_opt=module=github.com/ericbutera/bike/strava-gateway ../proto/bike/strava/v1/gateway.proto
cmp "$output_dir/gen/bike/strava/v1/gateway.pb.go" gen/bike/strava/v1/gateway.pb.go
cmp "$output_dir/gen/bike/strava/v1/gateway_grpc.pb.go" gen/bike/strava/v1/gateway_grpc.pb.go
'''

[tasks."db:migrate"]
run = "go run ./cmd/migrate"
