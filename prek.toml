minimum_prek_version = "0.4.0"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prettier"
name = "Prettier"
language = "system"
entry = "mise exec -- prettier --write --ignore-unknown"
files = "^ui-next/.*\\.(css|js|jsx|json|jsonc|md|mdx|ts|tsx|yaml|yml)$"
exclude = "^ui-next/(\\.next|coverage|dist|node_modules|public)/"

[[repos.hooks]]
id = "cargo-fmt-check"
name = "Cargo fmt check"
language = "system"
entry = "mise exec -- cargo fmt --all --check"
files = "\\.(rs|toml)$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "Cargo Clippy"
language = "system"
entry = "mise exec -- cargo clippy --workspace --all-targets -- -D warnings"
files = "\\.(rs|toml)$"
pass_filenames = false
