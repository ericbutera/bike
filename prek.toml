minimum_prek_version = "0.5.5"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "package-manager-pin"
name = "Mise package-manager pin freshness"
language = "system"
entry = "mise run pins:check"
files = "^mise\\.toml$|^bike-ui/(package\\.json|pnpm-lock\\.yaml|pnpm-workspace\\.yaml|mise\\.toml)$|^scripts/check-package-manager\\.sh$"
pass_filenames = false

[[repos.hooks]]
id = "shellcheck"
name = "ShellCheck"
language = "system"
entry = "mise run lint:sh"
files = "^scripts/.*\\.sh$|^bike-ui/docker-entrypoint-dev\\.sh$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "workflow-lint"
name = "Woodpecker workflow lint"
language = "system"
entry = "mise run ci:check"
files = "^\\.woodpecker/.*\\.yaml$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "image-build-plan"
name = "Release image build plan"
language = "system"
entry = "mise run images:plan"
files = "(^|/)Dockerfile(\\..*)?$|^docker-bake\\.hcl$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "coverage-policy"
name = "Changed-line coverage policy fixtures"
language = "system"
entry = "mise run coverage:test"
files = "^scripts/coverage-.*\\.sh$|^coverage-projects\\.json$|^(strava-gateway|map-renderer|bike-rs)/mise\\.toml$|^mise\\.toml$|^prek\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "synthetics-check"
name = "k6 synthetic configuration"
language = "system"
entry = "mise run synthetics:check"
files = "^integration-tests/.*\\.js$"
pass_filenames = false

[[repos.hooks]]
id = "compose-runtime"
name = "Shared development and E2E runtime configuration"
language = "system"
entry = "mise run runtime:check"
files = "^compose.*\\.yaml$|^bike-rs/compose\\.yaml$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-fmt-check"
name = "Rust formatting"
language = "system"
entry = "mise --cd bike-rs run fmt:check"
files = "^bike-rs/.*\\.(rs|toml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "Rust Clippy"
language = "system"
entry = "mise --cd bike-rs run lint"
files = "^bike-rs/.*\\.(rs|toml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "openapi-contract"
name = "Canonical OpenAPI contract freshness"
language = "system"
entry = "mise --cd bike-rs run openapi:check"
files = "^contracts/openapi/openapi\\.(json|yaml)$|^bike-rs/.*\\.(rs|toml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "ui-lint"
name = "UI ESLint"
language = "system"
entry = "mise --cd bike-ui run lint"
files = "^bike-ui/.*\\.(ts|tsx|js|jsx|mjs|json|toml|yaml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "ui-typecheck"
name = "UI TypeScript"
language = "system"
entry = "mise --cd bike-ui run typecheck"
files = "^bike-ui/.*\\.(ts|tsx|js|jsx|mjs|json|toml|yaml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "ui-format"
name = "UI formatting"
language = "system"
entry = "mise --cd bike-ui run format:check"
files = "^bike-ui/"
pass_filenames = false

[[repos.hooks]]
id = "renderer-lint"
name = "Renderer and shared JavaScript lint and formatting"
language = "system"
entry = "mise run lint:maps"
files = "^map-renderer/.*\\.(mjs|html|json|toml)$|^integration-tests/.*\\.js$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "gateway-vet"
name = "Gateway Go lint and formatting"
language = "system"
entry = "mise --cd strava-gateway run lint"
files = "^strava-gateway/(.*\\.(go|mod|sum)|mise\\.toml|\\.golangci\\.yml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "renderer-go"
name = "Renderer Go lint and formatting"
language = "system"
entry = "mise --cd map-renderer run lint:go"
files = "^map-renderer/(.*\\.(go|mod|sum)|mise\\.toml|\\.golangci\\.yml)$|^mise\\.toml$"
pass_filenames = false

[[repos.hooks]]
id = "maps-protobuf"
name = "Map service protobuf freshness"
language = "system"
entry = "mise --cd map-renderer run generate:protobuf:check"
files = "^(proto|bike-rs/proto)/bike/maps/.*\\.proto$|^map-renderer/gen/|^map-renderer/mise\\.toml$|^mise\\.toml$"
pass_filenames = false
