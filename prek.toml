minimum_prek_version = "0.4.0"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt-check"
name = "Rust formatting"
language = "system"
entry = "mise --cd bike-rs run fmt:check"
files = "^bike-rs/.*\\.(rs|toml)$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "Rust Clippy"
language = "system"
entry = "mise --cd bike-rs run lint"
files = "^bike-rs/.*\\.(rs|toml)$"
pass_filenames = false

[[repos.hooks]]
id = "ui-lint"
name = "UI ESLint"
language = "system"
entry = "mise --cd bike-ui run lint"
files = "^bike-ui/.*\\.(ts|tsx|js|jsx|mjs|json)$"
pass_filenames = false

[[repos.hooks]]
id = "ui-typecheck"
name = "UI TypeScript"
language = "system"
entry = "mise --cd bike-ui run typecheck"
files = "^bike-ui/.*\\.(ts|tsx|js|jsx|mjs|json)$"
pass_filenames = false

[[repos.hooks]]
id = "ui-format"
name = "UI formatting"
language = "system"
entry = "mise --cd bike-ui run format:check"
files = "^bike-ui/"
pass_filenames = false

[[repos.hooks]]
id = "renderer-format"
name = "Renderer formatting"
language = "system"
entry = "mise run format:check"
files = "^map-renderer/.*\\.(mjs|html)$"
pass_filenames = false

[[repos.hooks]]
id = "gateway-vet"
name = "Gateway Go vet"
language = "system"
entry = "mise --cd strava-gateway run lint"
files = "^strava-gateway/.*\\.(go|mod)$"
pass_filenames = false
