# Mise selects the package manager; a mismatched executable must fail.
pmOnFail: error
allowBuilds:
  sharp@0.35.5: true
  unrs-resolver@1.12.2: true
minimumReleaseAgeExclude:
  - "@next/env@16.4.0"
  - "@next/swc-darwin-arm64@16.4.0"
  - "@next/swc-darwin-x64@16.4.0"
  - "@next/swc-linux-arm64-gnu@16.4.0"
  - "@next/swc-linux-arm64-musl@16.4.0"
  - "@next/swc-linux-x64-gnu@16.4.0"
  - "@next/swc-linux-x64-musl@16.4.0"
  - "@next/swc-win32-arm64-msvc@16.4.0"
  - "@next/swc-win32-x64-msvc@16.4.0"
  - maplibre-gl@6.13.0
  - next@16.4.0
  - "@next/eslint-plugin-next@16.4.0"
  - eslint-config-next@16.4.0
strictPeerDependencies: true
overrides:
  # Next uses only globSync(..., { onlyDirectories: true }). tinyglobby provides
  # that API without the unpatched braces dependency (GHSA-vfj7-8cjw-p6xm).
  "@next/eslint-plugin-next@16.4.0>fast-glob": npm:tinyglobby@0.2.17
  # Mermaid's current releases still request vulnerable KaTeX 0.16. Preserve
  # renderToString compatibility with the first patched release.
  "mermaid@11.17.2>katex": 0.18.2
  # Next 16.4 wraps these plugins with its ESLint 10 rule-context adapter.
  # Correct their stale peer ranges only for the exact tested plugin releases.
  # The lint compatibility fixtures exercise their rules; remove these entries
  # when upstream plugin peer declarations support ESLint 10 directly.
  "eslint-plugin-import@2.32.0>eslint": "^9.0.0 || ^10.12.0"
  "eslint-plugin-jsx-a11y@6.10.2>eslint": "^9.0.0 || ^10.12.0"
  "eslint-plugin-react@7.37.5>eslint": "^9.7.0 || ^10.12.0"
