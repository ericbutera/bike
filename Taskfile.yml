version: "3"

vars:
  PROJECT_NAME: "bike"

tasks:
  ui-next:deps:
    desc: Install ui-next dependencies
    dir: ui-next
    cmds:
      - pnpm install

  ui-next:dev:
    desc: Start the bike Next frontend
    dir: ui-next
    deps: [ui-next:deps]
    cmds:
      - pnpm run dev

  api:dev:
    desc: Start the bike API
    cmds:
      - cargo run --bin api

  api:build:
    desc: Build the bike API
    cmds:
      - cargo build --release --bin api

  worker:dev:
    desc: Start the bike worker
    cmds:
      - cargo run --bin worker

  kaleido:version:
    desc: Print the bike ui-next Kaleido dependency version
    dir: ui-next
    cmds:
      - node -p "require('./package.json').dependencies['@ericbutera/kaleido']"

  kaleido:upgrade:
    desc: Upgrade bike ui-next to @ericbutera/kaleido VERSION=x.y.z
    requires:
      vars: [VERSION]
    dir: ui-next
    cmds:
      - pnpm up @ericbutera/kaleido@{{.VERSION}}
      - pnpm typecheck

  migration:up:
    desc: Run bike database migrations
    dir: migration
    cmds:
      - cargo run -- up

  test:
    desc: Run bike Rust tests
    cmds:
      - cargo test

  fmt:
    desc: Format the Rust workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check Rust formatting without writing changes
    cmds:
      - cargo fmt --all --check

  openapi:react-query:
    desc: Generate OpenAPI TypeScript definitions from running API
    cmds:
      - echo "Waiting for API to be ready..."
      - |
        OPENAPI_URL="${OPENAPI_URL:-http://localhost:3000/openapi.json}"
        for i in {1..30}; do
          status=$(curl -s -o /tmp/openapi.json -w "%{http_code}" "$OPENAPI_URL" || echo "000")
          if [ "$status" = "200" ]; then
            if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8')); if(!j.openapi) process.exit(2);" >/dev/null 2>&1; then
              break
            fi
          fi
          sleep 2
        done
      - npx openapi-typescript /tmp/openapi.json --output ui-next/lib/openapi/react-query/api.d.ts
      - rm -f /tmp/openapi.json
